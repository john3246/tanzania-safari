<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Group Safari Departure | Tanzania Safari Magic</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<meta name="description" content="Join this fixed-date group safari in Tanzania with Tanzania Safari Magic. View itinerary, price, and request your seat.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tanzaniasafarimagic.com/group-safaris">
<link rel="stylesheet" href="/css/seo.css">
<link rel="stylesheet" href="/css/corporate-ui.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css?v=7">
<link rel="stylesheet" href="/css/group-safaris.css?v=4">
<link rel="stylesheet" href="/css/experience.css?v=2">
</head>
<body>
<div id="header"></div>

<section class="group-hero" id="groupDetailHero">
  <div class="group-hero-bg" id="groupDetailHeroBg" style="background-image:url('/images/optimized/mbugani.webp')"></div>
  <div class="container group-hero-inner">
    <nav class="corp-breadcrumb" aria-label="Breadcrumb">
      <a href="/" data-i18n="groupDetail.home">Home</a><span>/</span>
      <a href="/group-safaris" data-i18n="groupDetail.groupSafaris">Group Safaris</a><span>/</span>
      <span id="groupCrumbTitle" data-i18n="groupDetail.departure">Departure</span>
    </nav>
    <span class="corp-eyebrow" style="color:rgba(255,255,255,0.85)" data-i18n="groupDetail.eyebrow">Small Group Safari</span>
    <h1 id="groupDetailTitle" data-i18n="groupDetail.loading">Loading departure…</h1>
    <p id="groupDetailSubtitle"></p>
  </div>
</section>

<div class="container">
  <div class="group-detail-layout" id="groupDetailRoot">
    <div class="group-detail-main">
      <nav class="group-tabs" aria-label="Sections">
        <a href="#overview_section" data-i18n="groupDetail.tabOverview">Overview</a>
        <a href="#packing_section" data-i18n="groupDetail.tabPacking">Packing</a>
        <a href="#price_section" data-i18n="groupDetail.tabPrice">Price</a>
        <a href="#itinerary_section" data-i18n="groupDetail.tabItinerary">Itinerary</a>
        <a href="#inclusions_section" data-i18n="groupDetail.tabInclusions">Inclusions</a>
        <a href="#visa_section" data-i18n="groupDetail.tabVisa">Visa &amp; docs</a>
      </nav>

      <section class="group-section" id="overview_section">
        <h2 data-i18n="groupDetail.tourOverview">Tour overview</h2>
        <div id="groupOverview"></div>
        <div class="group-highlights" id="groupHighlights"></div>
        <div id="groupForMe" style="margin-top:1.25rem;padding:1.1rem 1.25rem;background:#f7f8f6;border-radius:12px"></div>
      </section>

      <section class="group-section" id="packing_section">
        <h2 data-i18n="groupDetail.packingList">Safari packing list</h2>
        <div id="groupPacking"></div>
      </section>

      <section class="group-section" id="price_section">
        <h2 data-i18n="groupDetail.groupPrice">Group tour price</h2>
        <div id="groupPriceBlock"></div>
      </section>

      <section class="group-section" id="itinerary_section">
        <h2 data-i18n="groupDetail.itinerary">Itinerary</h2>
        <div id="groupItinerary"></div>
      </section>

      <section class="group-section" id="inclusions_section">
        <h2 data-i18n="groupDetail.inclusions">Inclusions</h2>
        <div id="groupInclusions"></div>
        <h3 style="margin-top:1.5rem;font-size:1.1rem" data-i18n="groupDetail.notIncluded">Not included</h3>
        <div id="groupExclusions"></div>
      </section>

      <section class="group-section" id="visa_section">
        <h2 data-i18n="groupDetail.visaDocs">Visa and documents</h2>
        <div id="groupVisa"></div>
      </section>
    </div>

    <aside class="group-summary-card" id="groupSummary">
      <div class="skeleton-card" style="height:220px"></div>
    </aside>
  </div>
</div>

<div id="footer"></div>
<script src="/js/layout-loader.js?v=22"></script>
<script src="/js/api.js?v=2"></script>
<script src="/js/accommodation-data.js?v=2"></script>
<script src="/js/group-safari-detail.js?v=5"></script>
</body>
</html>
