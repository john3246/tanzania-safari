<style>
  .kili-routes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
  .kili-route-card{display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 8px 24px rgba(0,0,0,0.08);transition:transform .2s ease,box-shadow .2s ease}
  .kili-route-card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,0.14)}
  .kili-route-card .kri-img{aspect-ratio:16/10;overflow:hidden;position:relative}
  .kili-route-card .kri-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
  .kili-route-card:hover .kri-img img{transform:scale(1.05)}
  .kili-route-card .kri-badge{position:absolute;top:0.75rem;left:0.75rem;background:rgba(0,0,0,0.65);color:#fff;font-size:0.72rem;font-weight:700;padding:0.3rem 0.6rem;border-radius:999px;letter-spacing:0.03em}
  .kili-route-card .kri-body{padding:1.25rem;display:flex;flex-direction:column;flex:1}
  .kili-route-card h3{margin:0 0 0.35rem;font-family:var(--font-heading)}
  .kili-route-card .kri-nick{font-size:0.78rem;color:var(--primary);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem}
  .kri-meta{display:flex;flex-wrap:wrap;gap:0.5rem;margin:0 0 0.75rem}
  .kri-meta span{font-size:0.75rem;background:#f1f3ef;color:var(--text-secondary);padding:0.28rem 0.55rem;border-radius:6px;font-weight:600}
  .kili-route-card .kri-sum{font-size:0.9rem;color:var(--text-muted);line-height:1.6;margin:0 0 1rem}
  .kili-route-card .kri-link{margin-top:auto;font-weight:700;color:var(--primary)}
  @media (max-width:600px){.kili-routes-grid{grid-template-columns:1fr}}
</style>
