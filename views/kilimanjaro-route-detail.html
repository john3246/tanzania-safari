<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="routePageTitle">Kilimanjaro Route | Tanzania Safari Magic</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<meta id="routeMetaDesc" name="description" content="Kilimanjaro climbing route details — difficulty, days, distance and summit success rate. Plan your private climb from Arusha.">
<meta name="robots" content="index, follow">
<link id="routeCanonical" rel="canonical" href="https://tanzaniasafarimagic.com/kilimanjaro/routes">
<link rel="stylesheet" href="/css/seo.css">
<link rel="stylesheet" href="/css/corporate-ui.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css?v=6">
<style>
  .kili-route-detail{padding:2.5rem 0 3.5rem}
  .krd-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin:1.75rem 0}
  .krd-stat{background:#fff;border:1px solid #e8ebe6;border-radius:12px;padding:1rem 1.1rem}
  .krd-stat .k{display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:0.3rem}
  .krd-stat .v{font-size:1.05rem;font-weight:700;color:var(--earth-dark)}
  .krd-body{line-height:1.8;color:var(--text-secondary);font-size:1.02rem}
  .krd-body h3{font-family:var(--font-heading);color:var(--earth-dark);margin:1.75rem 0 0.75rem}
  .krd-body ul{padding-left:1.25rem;margin:0 0 1rem}
  .krd-body li{margin:0.35rem 0}
  .krd-hero{border-radius:16px;overflow:hidden;aspect-ratio:16/9;margin:0 0 1.5rem;box-shadow:0 12px 30px rgba(0,0,0,0.12)}
  .krd-hero img{width:100%;height:100%;object-fit:cover}
  .krd-highlights{display:flex;flex-wrap:wrap;gap:0.5rem;margin:0 0 1.5rem}
  .krd-highlights span{font-size:0.82rem;background:#f1f3ef;color:var(--text-secondary);padding:0.35rem 0.7rem;border-radius:999px;font-weight:600}
  .krd-related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem;margin-top:1.25rem}
  .krd-related-card{display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 6px 18px rgba(0,0,0,0.08);transition:transform .2s ease}
  .krd-related-card:hover{transform:translateY(-3px)}
  .krd-related-card img{width:100%;aspect-ratio:16/10;object-fit:cover}
  .krd-related-card .b{padding:0.9rem 1rem}
  .krd-related-card h4{margin:0 0 0.25rem;font-family:var(--font-heading);font-size:1rem}
  .krd-cta{background:#f7f8f6;border:1px solid #e8ebe6;border-radius:16px;padding:1.75rem;margin-top:2.5rem;text-align:center}
</style>
</head>
<body>
<div id="header"></div>

<div id="routeContainer" class="kili-route-detail">
  <div class="container">
    <div class="skeleton-card" style="height:280px;margin-bottom:1.5rem"></div>
    <div class="skeleton-line" style="width:60%;height:1.5rem;margin-bottom:1rem"></div>
    <div class="skeleton-line" style="width:100%"></div>
    <div class="skeleton-line" style="width:90%"></div>
  </div>
</div>

<div id="footer"></div>
<script src="/js/layout-loader.js?v=14"></script>
<script src="/js/kilimanjaro-routes-data.js?v=1"></script>
<script src="/js/route-i18n.js?v=1"></script>
<script src="/js/kilimanjaro-route-detail.js?v=1"></script>
</body>
</html>
