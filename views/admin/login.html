<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login | Tanzania Safari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body), 'Inter',sans-serif;background:var(--bg-secondary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--bg-card);border-radius:var(--radius-lg);width:100%;max-width:420px;overflow:hidden;box-shadow:var(--shadow-xl);border:1px solid var(--border-light)}
.login-header{background:#263E22;padding:2.5rem 2rem;text-align:center;color:#fff}
.login-logo img {height: 80px; width: auto; margin: 0 auto; display: block; filter: brightness(0) invert(1);}
.login-subtitle{font-size:.875rem;opacity:.85; margin-top: 1rem; color: #D4AF37;}
.login-body{padding:2.5rem 2rem}
.form-group{margin-bottom:1.5rem}
.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text-secondary);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.875rem}
.form-control{width:100%;padding:1rem 1rem 1rem 2.75rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.95rem;font-family:inherit;outline:none;transition:var(--transition);color:var(--text-primary);background:var(--bg-card)}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-pale)}
.toggle-pw{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.875rem;transition:var(--transition)}
.toggle-pw:hover{color:var(--primary)}
.btn-login{width:100%;padding:1rem;background:#D4AF37;color:#1E311B;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:700;cursor:pointer;transition:var(--transition);margin-top:.5rem;font-family:inherit}
.btn-login:hover{background:#C5A028;transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn-login:disabled{opacity:.7;cursor:not-allowed;transform:none}
.error-msg{background:var(--error-bg);color:var(--error);border-radius:var(--radius-sm);padding:1rem;font-size:.875rem;margin-bottom:1.5rem;display:none;align-items:center;gap:.625rem; border:1px solid rgba(198, 40, 40, 0.2)}
.error-msg.show{display:flex}
.login-footer{text-align:center;padding:0 2rem 2.5rem;font-size:.85rem;color:var(--text-muted)}
.login-footer a{color:var(--primary);font-weight:600;text-decoration:none;transition:var(--transition)}
.login-footer a:hover{color:var(--primary-dark)}

/* Modal Styles */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
  opacity: 0; transition: opacity 0.3s;
}
.modal-overlay.show { display: flex; opacity: 1; }
.modal-card {
  background: var(--bg-card); width: 100%; max-width: 400px; border-radius: var(--radius-lg);
  padding: 2rem; box-shadow: var(--shadow-xl); transform: translateY(-20px); transition: transform 0.3s;
}
.modal-overlay.show .modal-card { transform: translateY(0); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.modal-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
.close-modal { background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted); }
.close-modal:hover { color: var(--text-primary); }
.forgot-pw-link { display: block; text-align: right; font-size: 0.85rem; color: var(--primary); text-decoration: none; margin-top: 0.5rem; }
.forgot-pw-link:hover { text-decoration: underline; }
.success-msg { background: #e8f5e9; color: #2e7d32; border-radius: var(--radius-sm); padding: 1rem; font-size: 0.875rem; margin-bottom: 1.5rem; display: none; align-items: center; gap: 0.625rem; border: 1px solid #a5d6a7; }
.success-msg.show { display: flex; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="login-logo"><img src="/images/logo.png" alt="Tanzania Safari Logo"></div>
    <div class="login-subtitle">Admin Control Panel</div>
  </div>
  <div class="login-body">
    <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span id="errorText">Invalid credentials</span></div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input class="form-control" type="email" name="email" required placeholder="admin@tanzaniasafari.com" autocomplete="email" id="emailInput">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input class="form-control" type="password" name="password" required placeholder="Enter your password" autocomplete="current-password" id="passwordInput">
          <button type="button" class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></button>
        </div>
        <a href="#" class="forgot-pw-link" id="forgotPwLink">Forgot Password?</a>
      </div>
      <button type="submit" class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In to Dashboard</button>
    </form>
  </div>
  <div class="login-footer"><a href="/"><i class="fas fa-arrow-left"></i> Back to Website</a></div>
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="forgotPwModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 class="modal-title">Reset Password</h3>
      <button class="close-modal" id="closeModal">&times;</button>
    </div>
    <div class="error-msg" id="forgotErrorMsg"><i class="fas fa-exclamation-circle"></i><span id="forgotErrorText">Error</span></div>
    <div class="success-msg" id="forgotSuccessMsg"><i class="fas fa-check-circle"></i><span id="forgotSuccessText">Success</span></div>
    <form id="forgotPwForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input class="form-control" type="email" name="email" required placeholder="Enter your email address">
        </div>
      </div>
      <button type="submit" class="btn-login" id="forgotBtn"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
    </form>
  </div>
</div>
<script>
document.getElementById('togglePw').addEventListener('click', function(){
  const inp = document.getElementById('passwordInput');
  const icon = this.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
});

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  err.classList.remove('show');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
  btn.disabled = true;
  const { email, password } = Object.fromEntries(new FormData(e.target));
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json();
    if (!r.ok || !data.success) throw new Error(data.message || 'Login failed');
    localStorage.setItem('adminToken', data.token);
    localStorage.setItem('adminUser', JSON.stringify(data.user));
    window.location.href = '/admin';
  } catch (ex) {
    document.getElementById('errorText').textContent = ex.message;
    err.classList.add('show');
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to Dashboard';
    btn.disabled = false;
  }
});

// Redirect if already logged in
if (localStorage.getItem('adminToken')) window.location.href = '/admin';

// Handle URL messages (from redirect)
const urlParams = new URLSearchParams(window.location.search);
const msgCode = urlParams.get('msg');
const errorMsg = document.getElementById('errorMsg');
const errorText = document.getElementById('errorText');

if (msgCode === 'registration_closed') {
    errorText.innerHTML = '<strong>Access Denied:</strong> Admin registration is closed. The system is already initialized.';
    errorMsg.classList.add('show');
    errorMsg.style.backgroundColor = '#e3f2fd';
    errorMsg.style.color = '#1565c0';
    errorMsg.style.borderColor = '#90caf9';
    errorMsg.querySelector('i').className = 'fas fa-info-circle';
} else if (msgCode === 'setup_complete') {
    errorText.innerHTML = '<strong>Success:</strong> Admin account created! You can now log in.';
    errorMsg.classList.add('show');
    errorMsg.style.backgroundColor = '#e8f5e9';
    errorMsg.style.color = '#2e7d32';
    errorMsg.style.borderColor = '#a5d6a7';
    errorMsg.querySelector('i').className = 'fas fa-check-circle';
    errorMsg.querySelector('i').className = 'fas fa-check-circle';
}

// Forgot Password Logic
const forgotModal = document.getElementById('forgotPwModal');
document.getElementById('forgotPwLink').addEventListener('click', e => {
  e.preventDefault();
  forgotModal.classList.add('show');
});
document.getElementById('closeModal').addEventListener('click', () => {
  forgotModal.classList.remove('show');
});
forgotModal.addEventListener('click', e => {
  if (e.target === forgotModal) forgotModal.classList.remove('show');
});

document.getElementById('forgotPwForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('forgotBtn');
  const err = document.getElementById('forgotErrorMsg');
  const success = document.getElementById('forgotSuccessMsg');
  
  err.classList.remove('show');
  success.classList.remove('show');
  
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
  btn.disabled = true;
  
  const { email } = Object.fromEntries(new FormData(e.target));
  
  try {
    const r = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await r.json();
    if (!r.ok || !data.success) throw new Error(data.message || 'Failed to send reset link');
    
    document.getElementById('forgotSuccessText').textContent = data.message;
    success.classList.add('show');
    document.getElementById('forgotPwForm').reset();
  } catch (ex) {
    document.getElementById('forgotErrorText').textContent = ex.message;
    err.classList.add('show');
  } finally {
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
