<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanzania Safari Magic | Corporate CMS Portal</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind-output.css?v=5">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bulletproof Standalone Styling for 100% Centered Clean Corporate UI -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #020617;
            color: #ffffff;
        }
        .login-wrapper {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
            position: relative;
        }
        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        .login-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65) contrast(1.2);
        }
        .login-bg-overlay {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(8px);
        }
        .login-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: auto;
        }
        .logo-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .logo-badge {
            display: inline-flex;
            padding: 0.75rem 1.25rem;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(16, 185, 129, 0.6);
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 0.75rem;
        }
        .logo-badge img {
            height: 3.5rem;
            width: auto;
        }
        .brand-title {
            font-size: 1.75rem;
            font-weight: 900;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.025em;
        }
        .brand-subtitle {
            font-size: 0.75rem;
            font-weight: 800;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.35rem;
        }
        .card-container {
            background: rgba(15, 23, 42, 0.96);
            border: 2px solid rgba(51, 65, 85, 0.9);
            border-radius: 1.5rem;
            padding: 2.25rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 900;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .input-relative {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.875rem;
        }
        .custom-input {
            width: 100%;
            box-sizing: border-box;
            background: #020617;
            border: 2px solid #334155;
            border-radius: 0.875rem;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            font-size: 0.875rem;
            font-weight: 800;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: #10b981;
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .pw-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0;
        }
        .pw-toggle:hover {
            color: #ffffff;
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 800;
            color: #cbd5e1;
            margin-bottom: 1.5rem;
        }
        .remember-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            background: #075e54;
            color: #ffffff;
            border: 2px solid rgba(16, 185, 129, 0.4);
            border-radius: 0.875rem;
            padding: 0.95rem;
            font-size: 0.875rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background: #054840;
        }
        .alert-error {
            background: #450a0a;
            border: 2px solid #ef4444;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.875rem 1rem;
            border-radius: 0.875rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .footer-link a {
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.9);
            padding: 0.625rem 1.25rem;
            border-radius: 0.875rem;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .footer-link a:hover {
            color: #ffffff;
            border-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        
        <!-- Hero Background Image (Balloon WebP) -->
        <div class="login-bg">
            <img 
                src="/images/optimized/balloon.webp" 
                alt="Tanzania Safari Hot Air Balloon"
                onerror="this.onerror=null; this.src='/images/hero.jpg'"
            >
            <div class="login-bg-overlay"></div>
        </div>

        <!-- Centered Login Box -->
        <div class="login-box">
            
            <!-- Header Branding Badge -->
            <div class="logo-header">
                <div class="logo-badge">
                    <img src="/images/logo.png" alt="Tanzania Safari Magic Logo">
                </div>
                <h1 class="brand-title">Tanzania Safari Magic</h1>
                <div class="brand-subtitle">Corporate CMS Portal</div>
            </div>

            <!-- Solid High Contrast Card -->
            <div class="card-container">
                
                <!-- Error Alert -->
                <div id="errorMsg" class="alert-error" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation text-red-400 text-base"></i>
                    <span id="errorText">Invalid email address or password provided.</span>
                </div>

                <!-- Form -->
                <form id="loginForm">
                    
                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fa-solid fa-envelope text-emerald-400 mr-1"></i> Email Address
                        </label>
                        <div class="input-relative">
                            <i class="fa-solid fa-at input-icon"></i>
                            <input 
                                type="email" 
                                name="email" 
                                id="emailInput" 
                                required 
                                placeholder="admin@tsmagic.com" 
                                class="custom-input"
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <label class="form-label" style="margin-bottom: 0;">
                                <i class="fa-solid fa-lock text-emerald-400 mr-1"></i> Password
                            </label>
                            <a href="#" id="forgotPwLink" style="font-size: 0.75rem; font-weight: 800; color: #34d399; text-decoration: none;">Forgot?</a>
                        </div>
                        <div class="input-relative">
                            <i class="fa-solid fa-key input-icon"></i>
                            <input 
                                type="password" 
                                name="password" 
                                id="passwordInput" 
                                required 
                                placeholder="••••••••••••" 
                                class="custom-input" 
                                style="padding-right: 2.75rem;"
                            >
                            <button type="button" id="togglePw" class="pw-toggle">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember & Security -->
                    <div class="remember-row">
                        <label class="remember-label">
                            <input type="checkbox" id="rememberMe" checked style="width: 1rem; height: 1rem; accent-color: #075e54;">
                            <span>Remember Session</span>
                        </label>
                        <span style="color: #94a3b8; font-size: 0.7rem;"><i class="fa-solid fa-shield-halved text-emerald-400"></i> SSL 256-bit</span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="loginBtn" class="btn-submit">
                        <i class="fa-solid fa-right-to-bracket text-base"></i> SIGN IN TO CMS
                    </button>
                </form>
            </div>

            <!-- Footer Link -->
            <div class="footer-link">
                <a href="/">
                    <i class="fa-solid fa-arrow-left text-emerald-400"></i> Back to Public Safari Website
                </a>
            </div>
        </div>
    </div>

    <!-- Password Reset Modal Overlay -->
    <div id="forgotPwModal" style="display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(8px); z-index: 50; align-items: center; justify-content: center; padding: 1rem;">
        <div style="background: #0f172a; border: 2px solid #334155; border-radius: 1.5rem; max-width: 420px; width: 100%; padding: 2rem; position: relative;">
            <button id="closeModal" style="position: absolute; top: 1rem; right: 1rem; background: #1e293b; border: none; color: #94a3b8; width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; cursor: pointer; font-size: 1.1rem;">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 style="font-size: 1.25rem; font-weight: 900; color: #ffffff; margin-top: 0; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fa-solid fa-lock-open text-emerald-400"></i> Reset Password
            </h3>
            <p style="font-size: 0.75rem; font-weight: 700; color: #cbd5e1; margin-bottom: 1.25rem;">Enter your admin email address to receive password reset instructions.</p>
            
            <div id="forgotErrorMsg" style="display: none; background: #450a0a; border: 1px solid #ef4444; color: #ffffff; font-size: 0.75rem; font-weight: 800; padding: 0.75rem; border-radius: 0.75rem; margin-bottom: 1rem;">
                <span id="forgotErrorText">Email not found</span>
            </div>
            
            <div id="forgotSuccessMsg" style="display: none; background: #064e3b; border: 1px solid #10b981; color: #ffffff; font-size: 0.75rem; font-weight: 800; padding: 0.75rem; border-radius: 0.75rem; margin-bottom: 1rem;">
                <span id="forgotSuccessText">Reset link has been sent!</span>
            </div>

            <form id="forgotPwForm">
                <div style="margin-bottom: 1rem;">
                    <label class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        name="email" 
                        id="forgotEmailInput" 
                        required 
                        placeholder="admin@tsmagic.com" 
                        class="custom-input"
                        style="padding-left: 1rem;"
                    >
                </div>
                <button type="submit" id="forgotBtn" class="btn-submit">
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>

    <!-- Login Auth Script -->
    <script>
        const API_BASE = '/api';

        // Toggle Password Visibility
        const togglePw = document.getElementById('togglePw');
        const pwInput = document.getElementById('passwordInput');
        togglePw.addEventListener('click', () => {
            const isPw = pwInput.type === 'password';
            pwInput.type = isPw ? 'text' : 'password';
            togglePw.innerHTML = isPw ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
        });

        // Handle Login Submission
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> SIGNING IN...';
            errorMsg.style.display = 'none';

            try {
                const res = await fetch(API_BASE + '/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(new FormData(loginForm)))
                });
                
                const result = await res.json();
                if (!res.ok) throw new Error(result.message || 'Authentication failed');

                if (result.token) {
                    localStorage.setItem('adminToken', result.token);
                    localStorage.setItem('token', result.token);
                    window.location.href = '/admin/dashboard';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('errorText').textContent = err.message || 'Login failed';
                errorMsg.style.display = 'flex';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> SIGN IN TO CMS';
            }
        });

        // Forgot Password Modal Triggers
        const forgotModal = document.getElementById('forgotPwModal');
        document.getElementById('forgotPwLink').addEventListener('click', (e) => {
            e.preventDefault();
            forgotModal.style.display = 'flex';
        });
        document.getElementById('closeModal').addEventListener('click', () => {
            forgotModal.style.display = 'none';
        });

        // Handle Forgot Password Submission
        const forgotForm = document.getElementById('forgotPwForm');
        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            const errDiv = document.getElementById('forgotErrorMsg');
            const successDiv = document.getElementById('forgotSuccessMsg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
            errDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                const res = await fetch(API_BASE + '/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(new FormData(forgotForm)))
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.message || 'Request failed');

                successDiv.style.display = 'block';
                forgotForm.reset();
            } catch (err) {
                console.error(err);
                document.getElementById('forgotErrorText').textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
