<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanzania Safari Magic | CMS Login</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind-output.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="h-full flex items-center justify-center font-sans bg-slate-950 relative overflow-hidden">
    <!-- Background Accents -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>

    <div class="w-full max-w-md px-6 py-12 relative z-10">
        <!-- Logo and Heading -->
        <div class="flex flex-col items-center mb-8">
            <img src="/images/logo.png" alt="Tanzania Safari Magic Logo" class="h-16 w-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold text-white tracking-tight text-center">Tanzania Safari Magic</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Corporate CMS Admin Portal</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur-md">
            <div id="errorMsg" class="hidden mb-6 bg-red-950/50 border border-red-500/50 text-red-200 text-xs px-4 py-3 rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                <span id="errorText">Invalid email or password</span>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input 
                            type="email" 
                            name="email" 
                            id="emailInput" 
                            required 
                            placeholder="admin@tsmagic.com" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10 transition-all placeholder:text-slate-600"
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input 
                            type="password" 
                            name="password" 
                            id="passwordInput" 
                            required 
                            placeholder="••••••••" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-12 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10 transition-all placeholder:text-slate-600"
                        >
                        <button type="button" id="togglePw" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <div class="text-right mt-2">
                        <a href="#" id="forgotPwLink" class="text-xs text-emerald-500 hover:text-emerald-400 font-semibold transition-colors">Forgot Password?</a>
                    </div>
                </div>

                <button 
                    type="submit" 
                    id="loginBtn" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-lg shadow-emerald-950/20 flex items-center justify-center gap-2 mt-2"
                >
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to CMS
                </button>
            </form>
        </div>

        <div class="text-center mt-8">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-400 transition-colors inline-flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Live Website
            </a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPwModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-8 mx-4 shadow-2xl relative">
            <button id="closeModal" class="absolute top-4 right-4 text-slate-500 hover:text-slate-350">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-lg font-bold text-white mb-2">Reset Password</h3>
            <p class="text-xs text-slate-400 mb-6">Enter your email address and we'll send you link instructions to reset your password.</p>
            
            <div id="forgotErrorMsg" class="hidden mb-4 bg-red-950/50 border border-red-500/50 text-red-200 text-xs px-4 py-3 rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                <span id="forgotErrorText">Email not found</span>
            </div>
            
            <div id="forgotSuccessMsg" class="hidden mb-4 bg-emerald-950/50 border border-emerald-500/50 text-emerald-200 text-xs px-4 py-3 rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-emerald-500"></i>
                <span id="forgotSuccessText">Reset link has been dispatched!</span>
            </div>

            <form id="forgotPwForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                    <input 
                        type="email" 
                        name="email" 
                        id="forgotEmailInput" 
                        required 
                        placeholder="admin@tsmagic.com" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10 transition-all placeholder:text-slate-600"
                    >
                </div>
                <button 
                    type="submit" 
                    id="forgotBtn" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all flex items-center justify-center gap-2"
                >
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>

    <!-- Login scripts -->
    <script>
        const API_BASE = '/api';

        // Toggle Password visibility
        const togglePw = document.getElementById('togglePw');
        const pwInput = document.getElementById('passwordInput');
        togglePw.addEventListener('click', () => {
            const isPw = pwInput.type === 'password';
            pwInput.type = isPw ? 'text' : 'password';
            togglePw.innerHTML = isPw ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
        });

        // Handle Login submission
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch(API_BASE + '/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(new FormData(loginForm)))
                });
                
                const result = await res.json();
                if (!res.ok) throw new Error(result.message || 'Login failed');

                if (result.token) {
                    localStorage.setItem('adminToken', result.token);
                    window.location.href = '/admin/dashboard';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('errorText').textContent = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to CMS';
            }
        });

        // Forgot password modal triggers
        const forgotModal = document.getElementById('forgotPwModal');
        document.getElementById('forgotPwLink').addEventListener('click', (e) => {
            e.preventDefault();
            forgotModal.classList.remove('hidden');
        });
        document.getElementById('closeModal').addEventListener('click', () => {
            forgotModal.classList.add('hidden');
        });

        // Handle Forgot password submission
        const forgotForm = document.getElementById('forgotPwForm');
        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            const errDiv = document.getElementById('forgotErrorMsg');
            const successDiv = document.getElementById('forgotSuccessMsg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            errDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const res = await fetch(API_BASE + '/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(new FormData(forgotForm)))
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.message || 'Request failed');

                successDiv.classList.remove('hidden');
                forgotForm.reset();
            } catch (err) {
                console.error(err);
                document.getElementById('forgotErrorText').textContent = err.message;
                errDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
