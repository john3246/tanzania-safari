<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Setup | Tanzania Safari</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700;800&family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body), 'Inter',sans-serif;background:var(--bg-secondary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--bg-card);border-radius:var(--radius-lg);width:100%;max-width:480px;overflow:hidden;box-shadow:var(--shadow-xl);border:1px solid var(--border-light)}
.login-header{background:var(--primary-dark);padding:2.5rem 2rem;text-align:center;color:#fff}
.login-logo{font-family:var(--font-heading), 'Fraunces',serif;font-size:1.75rem;font-weight:700;margin-bottom:.375rem}
.login-logo span{opacity:.8}
.login-subtitle{font-size:.875rem;opacity:.85}
.login-body{padding:2.5rem 2rem}
.form-group{margin-bottom:1.5rem}
.form-row { display: flex; gap: 1rem; }
.form-row .form-group { flex: 1; }
.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text-secondary);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.875rem}
.form-control{width:100%;padding:1rem 1rem 1rem 2.75rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.95rem;font-family:inherit;outline:none;transition:var(--transition);color:var(--text-primary);background:var(--bg-card)}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-pale)}
.toggle-pw{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.875rem;transition:var(--transition)}
.toggle-pw:hover{color:var(--primary)}
.btn-login{width:100%;padding:1rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;cursor:pointer;transition:var(--transition);margin-top:.5rem;font-family:inherit}
.btn-login:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn-login:disabled{opacity:.7;cursor:not-allowed;transform:none}
.error-msg{background:var(--error-bg);color:var(--error);border-radius:var(--radius-sm);padding:1rem;font-size:.875rem;margin-bottom:1.5rem;display:none;align-items:center;gap:.625rem; border:1px solid rgba(198, 40, 40, 0.2)}
.error-msg.show{display:flex}
.login-footer{text-align:center;padding:0 2rem 2.5rem;font-size:.85rem;color:var(--text-muted)}
.login-footer a{color:var(--primary);font-weight:600;text-decoration:none;transition:var(--transition)}
.login-footer a:hover{color:var(--primary-dark)}

/* Loading Overlay */
#loadingOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-secondary); z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.spinner { border: 4px solid rgba(0,0,0,0.1); border-left-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <p style="color: var(--text-muted); font-weight: 500;">Checking system status...</p>
</div>

<div class="login-card" id="registerCard" style="display: none;">
  <div class="login-header">
    <div class="login-logo">Tanzania<span>Safari</span></div>
    <div class="login-subtitle">System Initialization: Setup Admin</div>
  </div>
  <div class="login-body">
    <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span id="errorText">Error</span></div>
    <form id="registerForm">
      <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <div class="input-wrap">
              <i class="fas fa-user"></i>
              <input class="form-control" type="text" name="firstName" required placeholder="John">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <div class="input-wrap">
              <i class="fas fa-user"></i>
              <input class="form-control" type="text" name="lastName" required placeholder="Doe">
            </div>
          </div>
      </div>
      <div class="form-group">
        <label class="form-label">Admin Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input class="form-control" type="email" name="email" required placeholder="admin@tanzaniasafari.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Secure Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input class="form-control" type="password" name="password" required placeholder="Min. 6 characters" id="passwordInput" minlength="6">
          <button type="button" class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="registerBtn"><i class="fas fa-user-shield"></i> Initialize Admin Account</button>
    </form>
  </div>
  <div class="login-footer"><a href="/admin/login"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
</div>
<script>
// Toggle Password Visibility
document.getElementById('togglePw').addEventListener('click', function(){
  const inp = document.getElementById('passwordInput');
  const icon = this.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
});

// Initial Setup Check
async function checkRegistrationStatus() {
    try {
        const response = await fetch('/api/auth/can-register-admin');
        if (response.status === 403) {
            // Registration is closed. Redirect to login with a URL parameter for the banner.
            window.location.replace('/admin/login?msg=registration_closed');
            return;
        }
        // Show the form
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('registerCard').style.display = 'block';
    } catch (error) {
        document.getElementById('loadingOverlay').innerHTML = `<p style="color: var(--error);">Failed to connect to server.</p>`;
    }
}
checkRegistrationStatus();

// Handle Registration Submission
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const err = document.getElementById('errorMsg');
  err.classList.remove('show');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Initializing...';
  btn.disabled = true;

  const formData = Object.fromEntries(new FormData(e.target));
  
  try {
    const r = await fetch('/api/auth/register-admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });
    
    const data = await r.json();
    if (!r.ok || !data.success) throw new Error(data.message || data.errors?.[0]?.message || 'Registration failed');
    
    // Success! Redirect to login with success message
    window.location.href = '/admin/login?msg=setup_complete';
  } catch (ex) {
    document.getElementById('errorText').textContent = ex.message;
    err.classList.add('show');
    btn.innerHTML = '<i class="fas fa-user-shield"></i> Initialize Admin Account';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
