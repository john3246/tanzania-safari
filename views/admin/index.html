    <div class="modal-overlay" id="enqModal">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg border border-slate-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-semibold text-slate-800 text-base">Respond to Inquiry</h3>
                <button class="text-slate-400 hover:text-slate-600" onclick="closeModal('enqModal')"><i class="ph ph-x text-xl"></i></button>

                </div>
            </div>

                <button class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-white transition-colors" onclick="closeModal('enqModal')">Cancel</button>
                <button class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors inline-flex items-center space-x-2" onclick="sendEnquiryResponse()"><i class="ph ph-paper-plane"></i> <span>Send Reply</span></button>
