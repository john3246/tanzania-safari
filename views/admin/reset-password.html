<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | Tanzania Safari</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700;800&family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body), 'Inter',sans-serif;background:url('/images/logo.png') no-repeat center center fixed, linear-gradient(135deg, #465B2D 0%, #1F2914 100%);background-size:600px auto, cover;background-blend-mode:soft-light;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-card{background:rgba(255, 255, 255, 0.98);backdrop-filter:blur(20px);border-radius:24px;width:100%;max-width:440px;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.2)}
.login-header{background:transparent;padding:3rem 2rem 1rem;text-align:center;color:#465B2D;}
.login-logo img {height: 90px; width: auto; margin: 0 auto; display: block;}
.login-subtitle{font-size:0.95rem;opacity:0.9; margin-top: 1.5rem; color: #D4AF37; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;}
.login-body{padding:1.5rem 2.5rem 3rem}
.form-group{margin-bottom:1.5rem}
.form-label{display:block;font-size:0.8rem;font-weight:700;color:#465B2D;margin-bottom:0.6rem;text-transform:uppercase;letter-spacing:1px}
.input-wrap{position:relative}
.input-wrap > i{position:absolute;left:1.2rem;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:1rem}
.form-control{width:100%;padding:1.1rem 3rem 1.1rem 3rem;border:2px solid #e2e8f0;border-radius:12px;font-size:.95rem;font-family:inherit;outline:none;transition:all 0.3s ease;color:#1e293b;background:#f8fafc;font-weight:500;}
.form-control:focus{border-color:#465B2D;background:#fff;box-shadow:0 4px 12px rgba(70, 91, 45, 0.05)}
.toggle-pw{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1rem;transition:all 0.3s;padding:0.5rem;}
.btn-login{width:100%;padding:1.1rem;background:#D4AF37;color:#2C391C;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;margin-top:.5rem;font-family:inherit;text-transform:uppercase;letter-spacing:1px}
.btn-login:hover{background:#C5A028;transform:translateY(-2px);box-shadow:0 10px 20px rgba(212, 175, 55, 0.2)}
.btn-login:disabled{opacity:.7;cursor:not-allowed;transform:none;box-shadow:none}
.error-msg, .success-msg{border-radius:10px;padding:1rem;font-size:.875rem;margin-bottom:1.5rem;display:none;align-items:center;gap:.625rem;}
.error-msg{background:#fef2f2;color:#dc2626;border:1px solid #f87171}
.success-msg{background:#f0fdf4;color:#166534;border:1px solid #86efac}
.error-msg.show, .success-msg.show{display:flex}
.login-footer{text-align:center;padding:0 2.5rem 2.5rem;font-size:.9rem;color:#888}
.login-footer a{color:#465B2D;font-weight:600;text-decoration:none;transition:all 0.3s}
.login-footer a:hover{color:#1a2a17;text-decoration:underline}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="login-logo"><img src="/images/logo.png" alt="Tanzania Safari Logo"></div>
    <div class="login-subtitle">Reset Your Password</div>
  </div>
  <div class="login-body">
    <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span id="errorText">Error</span></div>
    <div class="success-msg" id="successMsg"><i class="fas fa-check-circle"></i><span id="successText">Success</span></div>
    <form id="resetForm">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input class="form-control" type="password" name="password" required placeholder="Min. 6 characters" id="passwordInput" minlength="6">
          <button type="button" class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="resetBtn"><i class="fas fa-key"></i> Reset Password</button>
    </form>
  </div>
  <div class="login-footer"><a href="/admin/login"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
</div>
<script>
document.getElementById('togglePw').addEventListener('click', function(){
  const inp = document.getElementById('passwordInput');
  const icon = this.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
});

const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
    document.getElementById('errorText').textContent = 'Invalid or missing reset token.';
    document.getElementById('errorMsg').classList.add('show');
    document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('resetBtn');
  const err = document.getElementById('errorMsg');
  const success = document.getElementById('successMsg');
  
  err.classList.remove('show');
  success.classList.remove('show');
  
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
  btn.disabled = true;
  
  const { password } = Object.fromEntries(new FormData(e.target));
  
  try {
    const r = await fetch(`/api/auth/reset-password/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    
    const data = await r.json();
    if (!r.ok || !data.success) throw new Error(data.message || 'Reset failed');
    
    document.getElementById('successText').textContent = data.message || 'Password has been reset successfully. You can now log in.';
    success.classList.add('show');
    document.getElementById('resetForm').style.display = 'none';
    
    setTimeout(() => {
        window.location.href = '/admin/login';
    }, 3000);
    
  } catch (ex) {
    document.getElementById('errorText').textContent = ex.message;
    err.classList.add('show');
    btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
