<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | Tanzania Safari</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body), 'Inter',sans-serif;background:var(--bg-secondary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--bg-card);border-radius:var(--radius-lg);width:100%;max-width:420px;overflow:hidden;box-shadow:var(--shadow-xl);border:1px solid var(--border-light)}
.login-header{background:var(--primary-dark);padding:2.5rem 2rem;text-align:center;color:#fff}
.login-logo{font-family:var(--font-heading), 'Playfair Display',serif;font-size:1.75rem;font-weight:700;margin-bottom:.375rem}
.login-logo span{opacity:.8}
.login-subtitle{font-size:.875rem;opacity:.85}
.login-body{padding:2.5rem 2rem}
.form-group{margin-bottom:1.5rem}
.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text-secondary);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.875rem}
.form-control{width:100%;padding:1rem 1rem 1rem 2.75rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.95rem;font-family:inherit;outline:none;transition:var(--transition);color:var(--text-primary);background:var(--bg-card)}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-pale)}
.toggle-pw{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.875rem;transition:var(--transition)}
.toggle-pw:hover{color:var(--primary)}
.btn-login{width:100%;padding:1rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;cursor:pointer;transition:var(--transition);margin-top:.5rem;font-family:inherit}
.btn-login:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn-login:disabled{opacity:.7;cursor:not-allowed;transform:none}
.error-msg, .success-msg{border-radius:var(--radius-sm);padding:1rem;font-size:.875rem;margin-bottom:1.5rem;display:none;align-items:center;gap:.625rem;}
.error-msg{background:var(--error-bg);color:var(--error);border:1px solid rgba(198, 40, 40, 0.2)}
.success-msg{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.error-msg.show, .success-msg.show{display:flex}
.login-footer{text-align:center;padding:0 2rem 2.5rem;font-size:.85rem;color:var(--text-muted)}
.login-footer a{color:var(--primary);font-weight:600;text-decoration:none;transition:var(--transition)}
.login-footer a:hover{color:var(--primary-dark)}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="login-logo">Tanzania<span>Safari</span></div>
    <div class="login-subtitle">Reset Your Password</div>
  </div>
  <div class="login-body">
    <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span id="errorText">Error</span></div>
    <div class="success-msg" id="successMsg"><i class="fas fa-check-circle"></i><span id="successText">Success</span></div>
    <form id="resetForm">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input class="form-control" type="password" name="password" required placeholder="Min. 6 characters" id="passwordInput" minlength="6">
          <button type="button" class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="resetBtn"><i class="fas fa-key"></i> Reset Password</button>
    </form>
  </div>
  <div class="login-footer"><a href="/admin/login"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
</div>
<script>
document.getElementById('togglePw').addEventListener('click', function(){
  const inp = document.getElementById('passwordInput');
  const icon = this.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
});

const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
    document.getElementById('errorText').textContent = 'Invalid or missing reset token.';
    document.getElementById('errorMsg').classList.add('show');
    document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('resetBtn');
  const err = document.getElementById('errorMsg');
  const success = document.getElementById('successMsg');
  
  err.classList.remove('show');
  success.classList.remove('show');
  
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
  btn.disabled = true;
  
  const { password } = Object.fromEntries(new FormData(e.target));
  
  try {
    const r = await fetch(`/api/auth/reset-password/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    
    const data = await r.json();
    if (!r.ok || !data.success) throw new Error(data.message || 'Reset failed');
    
    document.getElementById('successText').textContent = data.message || 'Password has been reset successfully. You can now log in.';
    success.classList.add('show');
    document.getElementById('resetForm').style.display = 'none';
    
    setTimeout(() => {
        window.location.href = '/admin/login';
    }, 3000);
    
  } catch (ex) {
    document.getElementById('errorText').textContent = ex.message;
    err.classList.add('show');
    btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
