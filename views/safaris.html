<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safari Packages | Tanzania Safari & Tours</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
<meta name="description" content="Browse all Tanzania safari packages. Filter by destination, duration, price and category.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<style>

</style>
</head>
<body>
<!-- Header -->
<div id="header"></div>

<style>
.hero-bg-grid {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 4px;
  background: #000;
}
.hero-bg-img {
  position: relative;
  overflow: hidden;
}
.hero-bg-img:nth-child(1) { grid-row: span 2; }
.hero-bg-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 10s ease;
  opacity: 0.85;
}
.hero-bg-img:hover img {
  transform: scale(1.1);
}
@media(max-width: 768px) {
  .hero-bg-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .hero-bg-img:nth-child(1) { grid-column: span 2; grid-row: span 1; }
}
</style>
<section class="page-hero">
  <div class="hero-bg-grid">
    <div class="hero-bg-img"><img src="/images/optimized/7-day-central-serengeti-big-cats-migration.webp" alt="Serengeti Safari"></div>
    <div class="hero-bg-img"><img src="/images/optimized/8-day-northern-serengeti-mara-river-crossing.webp" alt="River Crossing"></div>
    <div class="hero-bg-img"><img src="/images/optimized/6-day-machame-route-kilimanjaro.webp" alt="Kilimanjaro Trek"></div>
    <div class="hero-bg-img"><img src="/images/optimized/7-day-tanzania-honeymoon-safari.webp" alt="Honeymoon Safari"></div>
  </div>
  <div class="hero-overlay" style="background: rgba(0,0,0,0.4)"></div>
  <div class="page-hero-content">
    <div class="container">
      <h1 class="page-hero-title" style="text-shadow: 0 4px 20px rgba(0,0,0,0.6)">Safari Packages</h1>
      <div class="page-hero-breadcrumb" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5)">
        <a href="/">Home</a><span>/</span><span>Safaris</span>
      </div>
    </div>
  </div>
</section>

<section class="section bg-sand">
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <h2 style="margin:0;font-size:1.5rem">Explore <span style="color:var(--primary)">Safaris</span></h2>
    </div>
    <div class="search-filter-section" style="background: #fff; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid var(--border-light); margin-bottom: 3rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-light);">
          <h3 style="margin:0; font-size: 1.25rem; font-family: var(--font-heading); color: var(--earth-dark);"><i class="ph ph-faders" style="color:var(--primary); margin-right:0.5rem; vertical-align: middle;"></i> Refine Your Search</h3>
          <button onclick="clearFilters()" style="font-size:0.85rem;color:var(--text-muted);background:none;border:none;cursor:pointer;font-weight:500; transition: color 0.3s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">Clear All</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.25rem; align-items: end;">
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Search</label>
          <input type="text" id="searchInput" placeholder="Search safaris..." style="width: 100%; border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.3s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border-light)'">
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Category</label>
          <select id="categorySelect" onchange="applyFilters()" style="width: 100%; border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; background: #fff; outline: none; cursor: pointer;">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Destination</label>
          <select id="destinationSelect" onchange="applyFilters()" style="width: 100%; border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; background: #fff; outline: none; cursor: pointer;">
            <option value="all">All Destinations</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Duration</label>
          <select id="durationSelect" onchange="applyFilters()" style="width: 100%; border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; background: #fff; outline: none; cursor: pointer;">
            <option value="all">Any Duration</option>
            <option value="1-3">1–3 Days</option>
            <option value="4-6">4–6 Days</option>
            <option value="7-9">7–9 Days</option>
            <option value="10+">10+ Days</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Budget ($)</label>
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <input type="number" id="minPrice" placeholder="Min" min="0" style="width: 50%; border: 1px solid var(--border-light); padding: 0.85rem; border-radius: 8px; font-size: 0.9rem; outline: none;">
            <span style="color:var(--text-muted)">-</span>
            <input type="number" id="maxPrice" placeholder="Max" min="0" style="width: 50%; border: 1px solid var(--border-light); padding: 0.85rem; border-radius: 8px; font-size: 0.9rem; outline: none;">
          </div>
        </div>
        <div>
          <button class="btn btn-primary" onclick="applyFilters()" style="width: 100%; padding: 0.85rem; border-radius: 8px; font-weight: 600;"><i class="ph ph-magnifying-glass"></i> Search</button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div>
      <div class="results-header">
        <div class="results-count">Showing <strong id="resultCount">0</strong> safaris</div>
        <select class="sort-select" id="sortSelect" onchange="applyFilters()">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="duration-asc">Shortest First</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
        <div class="safari-grid" id="safarisGrid">
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<div id="footer"></div>

<script src="/js/layout-loader.js"></script>
<script src="/js/api.js"></script>
<script src="/js/safaris.js?v=2"></script>
</body>
</html>
