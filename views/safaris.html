<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safari Packages | Tanzania Safari & Tours</title>
<meta name="description" content="Browse all Tanzania safari packages. Filter by destination, duration, price and category.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<style>
.safaris-layout{display:grid;grid-template-columns:280px 1fr;gap:2rem;align-items:start}
@media(max-width:1024px){.safaris-layout{grid-template-columns:1fr}}
.sidebar{background:#fff;border-radius:var(--radius-lg);padding:1.75rem;box-shadow:var(--shadow-sm);border:1px solid var(--border);position:sticky;top:100px}
.sidebar-section{margin-bottom:1.75rem;padding-bottom:1.75rem;border-bottom:1px solid var(--border)}
.sidebar-section:last-child{margin:0;padding:0;border:none}
.sidebar-title{font-size:.8125rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:1rem}
.filter-group label{display:flex;align-items:center;gap:.625rem;font-size:.9rem;cursor:pointer;padding:.375rem 0;color:var(--text-secondary)}
.filter-group label:hover{color:var(--primary)}
.filter-group input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px}
.price-inputs{display:flex;gap:.625rem;align-items:center}
.price-inputs input{flex:1;padding:.625rem .75rem;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:.875rem;outline:none}
.price-inputs input:focus{border-color:var(--primary)}
.price-inputs span{color:var(--text-muted);font-size:.875rem}
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.results-count{font-size:.9rem;color:var(--text-muted)}
.results-count strong{color:var(--text-primary)}
.sort-select{padding:.5rem .875rem;border:1.5px solid var(--border);border-radius:var(--radius-full);font-size:.875rem;outline:none;cursor:pointer;background:#fff}
.sort-select:focus{border-color:var(--primary)}
.search-box{display:flex;gap:.5rem;margin-bottom:1rem}
.search-box input{flex:1;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:.875rem;outline:none}
.search-box input:focus{border-color:var(--primary)}
.search-box button{padding:.75rem 1rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer}
.mobile-filter-btn{display:none;margin-bottom:1rem;align-items:center;gap:.5rem}
.sidebar-mobile-header{display:none;justify-content:space-between;align-items:center;padding-bottom:1.5rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border)}
.sidebar-close{background:none;border:none;font-size:1.5rem;color:var(--text-primary);cursor:pointer}
.sidebar-main-title{font-size:1rem;margin:0}
@media(max-width:1024px){
  .mobile-filter-btn{display:flex}
  .sidebar{display:none;position:fixed;inset:0;z-index:var(--z-overlay);overflow-y:auto;border-radius:0;top:0;padding:2rem}
  .sidebar.open{display:block;animation:slideIn .3s ease}
  .sidebar-mobile-header{display:flex}
  .sidebar-main-title{display:none}
}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
</style>
</head>
<body>
<!-- Header -->
<div id="header"></div>

<section class="page-hero">
  <div class="hero-bg"><img src="/images/hero.jpg" alt="Safaris"></div>
  <div class="hero-overlay"></div>
  <div class="page-hero-content">
    <div class="container">
      <h1 class="page-hero-title">Safari Packages</h1>
      <div class="page-hero-breadcrumb">
        <a href="/">Home</a><span>/</span><span>Safaris</span>
      </div>
    </div>
  </div>
</section>

<section class="section bg-sand">
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <h2 style="margin:0;font-size:1.5rem">Explore <span style="color:var(--primary)">Safaris</span></h2>
        <button class="btn btn-outline mobile-filter-btn" id="mobileFilterBtn" style="margin:0"><i class="fas fa-sliders-h"></i> Filters</button>
    </div>
    <div class="safaris-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="filterSidebar">
        <div class="sidebar-mobile-header">
            <h3 style="font-size:1.1rem;margin:0">Filters</h3>
            <button onclick="closeFilterSidebar()" class="sidebar-close"><i class="fas fa-times"></i></button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
          <h3 class="sidebar-main-title">Filter Packages</h3>
          <button onclick="clearFilters()" style="font-size:.8125rem;color:var(--primary);background:none;border:none;cursor:pointer;font-weight:600">Clear All</button>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search safaris...">
          <button onclick="applyFilters()"><i class="fas fa-search"></i></button>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">Category</div>
          <div class="filter-group" id="categoryFilters"></div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">Destination</div>
          <div class="filter-group" id="destinationFilters"></div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">Duration</div>
          <div class="filter-group">
            <label><input type="radio" name="duration" value="all" checked> All Durations</label>
            <label><input type="radio" name="duration" value="1-3"> 1–3 Days</label>
            <label><input type="radio" name="duration" value="4-6"> 4–6 Days</label>
            <label><input type="radio" name="duration" value="7-9"> 7–9 Days</label>
            <label><input type="radio" name="duration" value="10+"> 10+ Days</label>
          </div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">Difficulty</div>
          <div class="filter-group">
            <label><input type="radio" name="difficulty" value="all" checked> All Levels</label>
            <label><input type="radio" name="difficulty" value="easy"> Easy</label>
            <label><input type="radio" name="difficulty" value="moderate"> Moderate</label>
            <label><input type="radio" name="difficulty" value="challenging"> Challenging</label>
          </div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">Price Range (USD)</div>
          <div class="price-inputs">
            <input type="number" id="minPrice" placeholder="Min" min="0">
            <span>to</span>
            <input type="number" id="maxPrice" placeholder="Max" min="0">
          </div>
        </div>
        <button class="btn btn-primary btn-block" onclick="applyFilters()" style="margin-top:1rem"><i class="fas fa-search"></i> Apply Filters</button>
      </aside>

      <!-- Results -->
      <div>
        <div class="results-header">
          <div class="results-count">Showing <strong id="resultCount">0</strong> safaris</div>
          <select class="sort-select" id="sortSelect" onchange="applyFilters()">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="duration-asc">Shortest First</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>
        <div class="safari-grid" id="safarisGrid">
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<div id="footer"></div>

<script src="/js/layout-loader.js"></script>
<script src="/js/api.js"></script>
<script src="/js/safaris.js"></script>
</body>
</html>
