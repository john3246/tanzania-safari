<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safari Packages | Tanzania Safari Tours from Arusha</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
<meta name="description" content="Browse private Tanzania safari packages: Serengeti migration, Ngorongoro, Kilimanjaro, and bush-to-beach Zanzibar combos. Filter by duration, destination, and budget.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tanzaniasafarimagic.com/safaris">
<link rel="stylesheet" href="/css/seo.css">
<link rel="stylesheet" href="/css/corporate-ui.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css?v=2">
</head>
<body>
<!-- Header -->
<div id="header"></div>

<section class="corp-page-hero">
  <div class="hero-slideshow">
    <div class="hero-slide active" style="background-image: url('/images/optimized/serengeti-national-park.webp');"></div>
    <div class="hero-slide" style="background-image: url('/images/optimized/balloon.webp');"></div>
    <div class="hero-slide" style="background-image: url('/images/optimized/mbugani.webp');"></div>
  </div>
  <div class="corp-page-hero-inner">
    <div class="container">
      <div class="corp-breadcrumb"><a href="/">Home</a><span>/</span><span>Safaris</span></div>
      <span class="corp-eyebrow">Browse Private Itineraries</span>
      <h1 class="page-hero-title" style="color:#fff;margin:0">Tanzania Safari Packages</h1>
      <p style="max-width:36rem;margin:0.75rem 0 0;color:rgba(255,255,255,0.9)">Serengeti migration, Ngorongoro crater, Kilimanjaro, and bush-to-beach Zanzibar combos — designed from Arusha.</p>
    </div>
  </div>
</section>

<section class="corp-section">
  <div class="container">
    <div class="mobile-filter-bar">
      <button type="button" class="btn btn-primary" id="openFilterDrawer" aria-haspopup="dialog">
        <i class="fas fa-sliders-h"></i> Filter &amp; Search Packages
      </button>
    </div>

    <div class="search-filter-section desktop-filters" id="safariFilters" style="background: #fff; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid var(--border-light); margin-bottom: 3rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-light);">
          <h2 style="margin:0; font-size: 1.25rem; font-family: var(--font-heading); color: var(--earth-dark);"><i class="fas fa-sliders-h" style="color:var(--primary); margin-right:0.5rem;"></i> Refine Your Search</h2>
          <button type="button" onclick="clearFilters()" style="font-size:0.85rem;color:var(--text-muted);background:none;border:none;cursor:pointer;font-weight:500;min-height:48px">Clear All</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.25rem; align-items: end;">
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Search</label>
          <input type="text" id="searchInput" placeholder="Search safaris..." style="width: 100%; border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; min-height:48px; outline: none;">
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Category</label>
          <select id="categorySelect" onchange="applyFilters()" style="width: 100%; border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; background: #fff; min-height:48px; cursor: pointer;">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Destination</label>
          <select id="destinationSelect" onchange="applyFilters()" style="width: 100%; border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; background: #fff; min-height:48px; cursor: pointer;">
            <option value="all">All Destinations</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Duration</label>
          <select id="durationSelect" onchange="applyFilters()" style="width: 100%; border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; background: #fff; min-height:48px; cursor: pointer;">
            <option value="all">Any Duration</option>
            <option value="1-3">1–3 Days</option>
            <option value="4-6">4–6 Days</option>
            <option value="7-9">7–9 Days</option>
            <option value="10+">10+ Days</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Budget ($)</label>
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <input type="number" id="minPrice" placeholder="Min" min="0" style="width: 50%; border: 1px solid var(--border-light); padding: 0.85rem; border-radius: 8px; font-size: 0.9rem; min-height:48px; outline: none;">
            <span style="color:var(--text-muted)">-</span>
            <input type="number" id="maxPrice" placeholder="Max" min="0" style="width: 50%; border: 1px solid var(--border-light); padding: 0.85rem; border-radius: 8px; font-size: 0.9rem; min-height:48px; outline: none;">
          </div>
        </div>
        <div>
          <button class="btn btn-primary" type="button" onclick="applyFilters(); closeFilterDrawer && closeFilterDrawer();" style="width: 100%; padding: 0.85rem; border-radius: 8px; font-weight: 600;"><i class="fas fa-search"></i> Search</button>
        </div>
      </div>
    </div>

    <div class="filter-drawer-backdrop" id="filterDrawerBackdrop" hidden></div>
    <div class="filter-drawer" id="filterDrawer" role="dialog" aria-modal="true" aria-label="Filter safaris" hidden>
      <div class="filter-drawer-handle"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h3 style="margin:0;font-size:1.1rem">Filters</h3>
        <button type="button" class="btn btn-ghost" id="closeFilterDrawer" style="min-height:48px">Close</button>
      </div>
      <div id="filterDrawerBody"></div>
    </div>

    <!-- Results -->
    <div>
      <div class="results-header">
        <div class="results-count">Showing <strong id="resultCount">0</strong> safaris</div>
        <select class="sort-select" id="sortSelect" onchange="applyFilters()" style="min-height:48px">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="duration-asc">Shortest First</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
        <div class="safari-grid" id="safarisGrid">
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<div id="footer"></div>

<script src="/js/layout-loader.js?v=3"></script>
<script src="/js/api.js"></script>
<script src="/js/safaris.js"></script>
<script>
(function () {
  const filters = document.getElementById('safariFilters');
  const drawer = document.getElementById('filterDrawer');
  const backdrop = document.getElementById('filterDrawerBackdrop');
  const body = document.getElementById('filterDrawerBody');
  const openBtn = document.getElementById('openFilterDrawer');
  const closeBtn = document.getElementById('closeFilterDrawer');
  if (!filters || !drawer || !body) return;

  const homeParent = filters.parentElement;
  const homeNext = filters.nextElementSibling;

  function restoreFiltersHome() {
    filters.classList.remove('in-drawer');
    filters.classList.add('desktop-filters');
    if (homeNext && homeNext.parentElement === homeParent) {
      homeParent.insertBefore(filters, homeNext);
    } else {
      homeParent.insertBefore(filters, homeParent.querySelector('.results-header')?.parentElement || null);
    }
  }

  function openFilterDrawer() {
    if (!body.contains(filters)) {
      filters.classList.add('in-drawer');
      filters.classList.remove('desktop-filters');
      body.appendChild(filters);
    }
    drawer.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(() => {
      drawer.classList.add('open');
      backdrop.classList.add('open');
    });
    document.body.style.overflow = 'hidden';
  }
  function closeFilterDrawer() {
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(() => {
      drawer.hidden = true;
      backdrop.hidden = true;
      restoreFiltersHome();
    }, 280);
  }
  window.closeFilterDrawer = closeFilterDrawer;
  openBtn?.addEventListener('click', openFilterDrawer);
  closeBtn?.addEventListener('click', closeFilterDrawer);
  backdrop?.addEventListener('click', closeFilterDrawer);
  window.addEventListener('resize', () => {
    if (window.innerWidth > 768 && body.contains(filters)) {
      closeFilterDrawer();
    }
  });
})();
</script>
</body>
</html>
