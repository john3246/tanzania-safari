<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safari Packages | Tanzania Safari & Tours</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
<meta name="description" content="Browse all Tanzania safari packages. Filter by destination, duration, price and category.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<style>

</style>
</head>
<body>
<!-- Header -->
<div id="header"></div>

<section class="page-hero">
  <div class="hero-bg"><img src="/images/hero.jpg" alt="Safaris"></div>
  <div class="hero-overlay"></div>
  <div class="page-hero-content">
    <div class="container">
      <h1 class="page-hero-title">Safari Packages</h1>
      <div class="page-hero-breadcrumb">
        <a href="/">Home</a><span>/</span><span>Safaris</span>
      </div>
    </div>
  </div>
</section>

<section class="section bg-sand">
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <h2 style="margin:0;font-size:1.5rem">Explore <span style="color:var(--primary)">Safaris</span></h2>
    </div>
    <div class="search-filter-section" style="background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3 style="margin:0; font-size: 1.1rem;"><i class="fas fa-filter" style="color:var(--primary); margin-right:0.5rem;"></i> Filter Packages</h3>
          <button onclick="clearFilters()" style="font-size:.8125rem;color:var(--primary);background:none;border:none;cursor:pointer;font-weight:600">Clear All</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;">
        <div style="flex: 1; min-width: 200px;">
          <input type="text" id="searchInput" placeholder="Search safaris..." style="width: 100%; border: 1.5px solid var(--border); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem;">
        </div>
        <div style="flex: 1; min-width: 150px;">
          <select id="categorySelect" onchange="applyFilters()" style="width: 100%; border: 1.5px solid var(--border); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem; background: #fff;">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 150px;">
          <select id="destinationSelect" onchange="applyFilters()" style="width: 100%; border: 1.5px solid var(--border); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem; background: #fff;">
            <option value="all">All Destinations</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 150px;">
          <select id="durationSelect" onchange="applyFilters()" style="width: 100%; border: 1.5px solid var(--border); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem; background: #fff;">
            <option value="all">All Durations</option>
            <option value="1-3">1–3 Days</option>
            <option value="4-6">4–6 Days</option>
            <option value="7-9">7–9 Days</option>
            <option value="10+">10+ Days</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 150px;">
          <select id="difficultySelect" onchange="applyFilters()" style="width: 100%; border: 1.5px solid var(--border); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem; background: #fff;">
            <option value="all">All Levels</option>
            <option value="easy">Easy</option>
            <option value="moderate">Moderate</option>
            <option value="challenging">Challenging</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 250px; display: flex; gap: 0.5rem; align-items: center;">
          <input type="number" id="minPrice" placeholder="Min $" min="0" style="width: 50%; border: 1.5px solid var(--border); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem;">
          <span style="color:var(--text-muted)">-</span>
          <input type="number" id="maxPrice" placeholder="Max $" min="0" style="width: 50%; border: 1.5px solid var(--border); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem;">
        </div>
        <div style="flex: 0 0 auto;">
          <button class="btn btn-primary" onclick="applyFilters()" style="padding: 0.75rem 1.5rem;"><i class="fas fa-search"></i> Apply</button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div>
      <div class="results-header">
        <div class="results-count">Showing <strong id="resultCount">0</strong> safaris</div>
        <select class="sort-select" id="sortSelect" onchange="applyFilters()">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="duration-asc">Shortest First</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
        <div class="safari-grid" id="safarisGrid">
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-body"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div></div>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<div id="footer"></div>

<script src="/js/layout-loader.js"></script>
<script src="/js/api.js"></script>
<script src="/js/safaris.js?v=2"></script>
</body>
</html>
