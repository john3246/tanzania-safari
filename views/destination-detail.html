<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Details | Tanzania Safari Magic</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta name="description" content="Explore Tanzania safari destinations — Serengeti, Ngorongoro, Tarangire, Lake Manyara, Kilimanjaro, and Zanzibar — with local guides from Arusha.">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="/css/seo.css">
    <link rel="stylesheet" href="/css/corporate-ui.css">
    <script src="/js/seo.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .months-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.25rem; margin-bottom: 1rem; }
        @media(max-width: 768px) { .months-grid { grid-template-columns: repeat(6, 1fr); gap: 0.5rem; } }
        .month { text-align: center; padding: 0.5rem 0; font-size: 0.75rem; font-weight: 600; border-radius: 4px; color: #fff; }
        .month.excellent { background: var(--success); }
        .month.good { background: #f59e0b; }
        .month.poor { background: var(--text-muted); opacity: 0.5; }
        .legend { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 1rem; }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; }
        .legend-color.excellent { background: var(--success); }
        .legend-color.good { background: #f59e0b; }
        .legend-color.poor { background: var(--text-muted); opacity: 0.5; }
        .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90vh; object-fit: contain; border-radius: 8px; }
        .lightbox-close { position: fixed; top: 1.5rem; right: 1.5rem; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 1.5rem; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <!-- Header -->
<div id="header"></div>

<!-- Dynamic Content Area -->
<main id="destinationDetailContent">
    <div class="loading-container" style="text-align: center; padding: 4rem;">
        <div class="loader-circle" style="margin: 0 auto 1rem;"></div>
        <p>Loading destination details...</p>
    </div>
</main>

<!-- Footer -->
<div id="footer"></div>

<script src="/js/layout-loader.js"></script>
<script src="/js/api.js"></script>
<script src="/js/destination-detail.js"></script>
</body>
</html>
