    <style>
        .months-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.35rem; margin-bottom: 1rem; }
        @media(max-width: 768px) { .months-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.4rem; } }
        @media(max-width: 380px) { .months-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        .month { text-align: center; padding: 0.5rem 0; font-size: 0.75rem; font-weight: 600; border-radius: 4px; color: #fff; }
        .month.excellent { background: var(--success); }
        .month.good { background: #f59e0b; }
        .month.poor { background: var(--text-muted); opacity: 0.5; }
        .legend { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 1rem; }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; }
        .legend-color.excellent { background: var(--success); }
        .legend-color.good { background: #f59e0b; }
        .legend-color.poor { background: var(--text-muted); opacity: 0.5; }
        .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 1.25rem; }
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: min(100%, 92vw); max-height: 86vh; width: auto; height: auto; object-fit: contain; margin: auto; border-radius: 8px; }
        .lightbox-close { position: fixed; top: 1.5rem; right: 1.5rem; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 1.5rem; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
        .dest-guide { margin-top: 1.5rem; }
        .dest-guide .guide-lead { font-size: 1.12rem; line-height: 1.75; }
        .dest-table-wrap { overflow-x: auto; margin: 1.25rem 0 1.75rem; border-radius: 12px; border: 1px solid rgba(70, 91, 45,0.1); }
        .dest-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
        .dest-table th, .dest-table td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.06); }
        .dest-table th { background: #f4f7f4; font-weight: 700; color: var(--earth-dark); }
        .dest-table tr:last-child td { border-bottom: none; }
        .dest-guide-panel { background: #fff; border-radius: 16px; border: 1px solid rgba(70, 91, 45,0.08); padding: clamp(1.25rem, 3vw, 2rem); box-shadow: 0 8px 28px rgba(70, 91, 45,0.05); margin-bottom: 1.25rem; min-width: 0; max-width: 100%; }
    </style>
