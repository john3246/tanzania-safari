<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blog Post | Tanzania Safari</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<style>
.post-container{max-width:800px;margin:0 auto;padding:4rem 1.5rem}
.post-header{text-align:center;margin-bottom:3rem}
.post-category{color:var(--primary);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:.8125rem;margin-bottom:1rem;display:block}
.post-title{font-size:3rem;line-height:1.2;margin-bottom:1.5rem}
@media(max-width:768px){.post-title{font-size:2.25rem}}
.post-meta{display:flex;justify-content:center;gap:2rem;color:var(--text-muted);font-size:.9rem}
.post-featured-img{width:100%;aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:3rem}
.post-featured-img img{width:100%;height:100%;object-fit:cover}
.post-content{line-height:1.8;color:var(--text-secondary);font-size:1.125rem}
.post-content p{margin-bottom:1.5rem}
.post-content h2, .post-content h3{color:var(--earth-dark);margin:2.5rem 0 1rem}
.post-footer{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.post-share{display:flex;gap:1rem}
.share-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);color:var(--text-primary);transition:var(--transition)}
.share-btn:hover{background:var(--primary);color:#fff}
</style>
</head>
<body>
<div id="header"></div>

<section class="post-container" id="postContainer">
    <div class="skeleton-card" style="height:600px"></div>
</section>

<div id="footer"></div>
<script src="/js/seo.js?v=4" defer></script>
<script src="/js/layout-loader.js?v=4" defer></script>
<script src="/js/api.js"></script>
<script src="/js/blog-detail.js"></script>
</body>
</html>
