<div id="page-system-logs" class="page">
    <div class="space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">System Logs</h1>
                <p class="text-sm text-gray-500 mt-1">Audit trail of admin actions, profile changes, and campaigns.</p>
            </div>
            <div class="flex gap-2">
                <input id="logSearch" type="search" placeholder="Search actions…" class="border border-gray-200 rounded-lg px-3 py-2 text-sm" onkeydown="if(event.key==='Enter')loadSystemLogs()">
                <button type="button" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold" onclick="loadSystemLogs()">Refresh</button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="logStats">
            <div class="bg-white border border-gray-100 rounded-xl p-4"><div class="text-xs text-gray-500">Total</div><div class="text-xl font-bold" id="logStatTotal">—</div></div>
            <div class="bg-white border border-gray-100 rounded-xl p-4"><div class="text-xs text-gray-500">Actors</div><div class="text-xl font-bold" id="logStatActors">—</div></div>
            <div class="bg-white border border-gray-100 rounded-xl p-4"><div class="text-xs text-gray-500">Creates</div><div class="text-xl font-bold" id="logStatCreates">—</div></div>
            <div class="bg-white border border-gray-100 rounded-xl p-4"><div class="text-xs text-gray-500">Updates</div><div class="text-xl font-bold" id="logStatUpdates">—</div></div>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                        <tr>
                            <th class="px-4 py-3">When</th>
                            <th class="px-4 py-3">Actor</th>
                            <th class="px-4 py-3">Action</th>
                            <th class="px-4 py-3">Entity</th>
                            <th class="px-4 py-3">Details</th>
                        </tr>
                    </thead>
                    <tbody id="systemLogsBody" class="divide-y divide-gray-50">
                        <tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
