<div class="page bg-white rounded-xl border border-slate-200 shadow-2xs overflow-hidden" id="page-packages">
                <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="font-semibold text-slate-800">Safari Inventory</h3>
                    <button class="bg-primary-500 hover:bg-primary-600 text-white px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors inline-flex items-center space-x-2" onclick="openPackageModal()"><i class="ph ph-plus"></i> <span>Add Package</span></button>
                </div>
                
                <!-- Search and Filters -->
                <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="flex-1">
                            <input type="search" id="packageSearch" placeholder="Search packages..." class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-primary-500" oninput="debounceSearch('packages', this.value)">
                        </div>
                        <div class="flex gap-2">
                            <select id="packageStatusFilter" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-primary-500" onchange="applyFilters('packages')">
                                <option value="">All Status</option>
                                <option value="active">Active</option>
                                <option value="draft">Draft</option>
                                <option value="archived">Archived</option>
                            </select>
                            <select id="packageCategoryFilter" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-primary-500" onchange="applyFilters('packages')">
                                <option value="">All Categories</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Bulk Actions Bar -->
                <div id="packageBulkActions" class="hidden px-6 py-3 bg-primary-50 border-b border-primary-100 flex items-center justify-between">
                    <span class="text-sm text-primary-700"><span id="packageSelectedCount">0</span> selected</span>
                    <div class="flex gap-2">
                        <button onclick="bulkAction('packages', 'archive')" class="px-3 py-1.5 bg-white border border-slate-200 rounded-md text-sm hover:bg-slate-50">Archive</button>
                        <button onclick="bulkAction('packages', 'delete')" class="px-3 py-1.5 bg-red-500 text-white rounded-md text-sm hover:bg-red-600">Delete</button>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-slate-400 text-xs font-semibold uppercase border-b border-slate-100">
                            <tr class="h-11">
                                <th class="px-6 w-10"><input type="checkbox" id="packageSelectAll" onchange="toggleSelectAll('packages')"></th>
                                <th class="px-6">Package</th>
                                <th class="px-6">Category</th>
                                <th class="px-6">Price</th>
                                <th class="px-6">Duration</th>
                                <th class="px-6">Status</th>
                                <th class="px-6">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="pkgBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="px-6 py-4 border-t border-slate-100 flex items-center justify-between">
                    <span class="text-sm text-slate-500" id="packagePaginationInfo">Showing 1-10 of 50</span>
                    <div class="flex gap-2">
                        <button onclick="changePage('packages', 'prev')" class="px-3 py-1 border border-slate-200 rounded text-sm hover:bg-slate-50">Previous</button>
                        <button onclick="changePage('packages', 'next')" class="px-3 py-1 border border-slate-200 rounded text-sm hover:bg-slate-50">Next</button>
                    </div>
                </div>
            </div>
