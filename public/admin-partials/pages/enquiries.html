<div id="page-enquiries" class="page">
<div class="page bg-white rounded-xl border border-slate-200 shadow-2xs overflow-hidden" id="page-enquiries">
                <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between"><h3 class="font-semibold text-slate-800">Customer Inquiries</h3></div>
                <div class="overflow-x-auto">
                    <div class="table-responsive">
<table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-slate-400 text-xs font-semibold uppercase border-b border-slate-100"><tr class="h-11"><th class="px-6">Sender</th><th class="px-6">Subject</th><th class="px-6">Date</th><th class="px-6">Status</th><th class="px-6">Actions</th></tr></thead>
                        <tbody id="enqBody" class="divide-y divide-slate-100"></tbody>
                    </table>
</div>
                </div>
            </div>
</div>
<!-- Enquiry Response Modal -->
<div class=""modal-backdrop"" id=""enqModal"">
    <div class=""modal"">
        <div class=""modal-header"">
            <h3 class=""modal-title"">Respond to Inquiry</h3>
            <button class=""modal-close"" onclick=""document.getElementById('enqModal').classList.remove('active')"">&times;</button>
        </div>
        <div class=""modal-body"">
            <div id=""enqDetails"" class=""mb-4""></div>
            <input type=""hidden"" id=""enqRespondId"">
            <div class=""form-group"">
                <label class=""form-label"">Your Response</label>
                <textarea id=""enqResponse"" class=""form-control"" rows=""5"" placeholder=""Type your response here...""></textarea>
            </div>
        </div>
        <div class=""modal-footer"">
            <button class=""btn btn-outline"" onclick=""document.getElementById('enqModal').classList.remove('active')"">Cancel</button>
            <button class=""btn btn-primary"" onclick=""sendEnquiryResponse()"">Send Response</button>
        </div>
    </div>
</div>
