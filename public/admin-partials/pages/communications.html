<div id="page-communications" class="page">
    <div class="space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-800">Email Campaigns</h1>
                <p class="text-sm text-slate-500 mt-1">Broadcast to newsletter subscribers — tours, destinations, blog, offers, reviews.</p>
            </div>
                <div class="text-sm text-slate-600 bg-white border border-slate-200 rounded-lg px-3 py-2">
                    Audience (unique): <strong id="subscriberCount">—</strong>
                    <span class="text-xs text-slate-400 block">Newsletter + customers + bookings · 100/batch · no duplicate sends</span>
                </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
            <div class="xl:col-span-2 bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                <form id="communicationsForm" onsubmit="event.preventDefault(); sendBroadcastEmail();">
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Audience</label>
                            <div class="flex flex-wrap gap-4">
                                <label class="inline-flex items-center"><input type="radio" class="form-radio text-emerald-600" name="recipientType" value="subscribers" checked onchange="toggleCustomEmailInput()"><span class="ml-2 text-sm">Newsletter subscribers</span></label>
                                <label class="inline-flex items-center"><input type="radio" class="form-radio text-emerald-600" name="recipientType" value="all_users" onchange="toggleCustomEmailInput()"><span class="ml-2 text-sm">Admin users</span></label>
                                <label class="inline-flex items-center"><input type="radio" class="form-radio text-emerald-600" name="recipientType" value="custom" onchange="toggleCustomEmailInput()"><span class="ml-2 text-sm">Custom email</span></label>
                            </div>
                        </div>

                        <div id="customEmailInputContainer" class="hidden">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Recipient email</label>
                            <input type="email" id="customEmailAddress" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="name@example.com">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Campaign type</label>
                            <select id="campaignType" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" onchange="onCampaignTypeChange()">
                                <option value="custom">Custom message</option>
                                <option value="tour">Tour / safari package</option>
                                <option value="destination">Destination</option>
                                <option value="blog">Blog post</option>
                                <option value="offer">Offer / discount</option>
                                <option value="review">Guest review</option>
                            </select>
                        </div>

                        <div id="contentRefWrap" class="hidden">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Select content</label>
                            <select id="contentRef" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></select>
                            <button type="button" class="mt-2 text-sm text-emerald-700 font-semibold" onclick="previewCampaign()">Load preview into subject/body</button>
                        </div>

                        <div id="offerFields" class="hidden space-y-3 p-4 bg-slate-50 rounded-lg border border-slate-100">
                            <input id="offerTitle" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="Offer title">
                            <textarea id="offerMessage" rows="3" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="Offer details"></textarea>
                            <input id="offerCtaUrl" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="CTA URL (optional)">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Subject</label>
                            <input type="text" id="emailSubject" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="Email subject">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Message body (HTML)</label>
                            <textarea id="emailBody" required rows="12" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono" placeholder="Write your message..."></textarea>
                        </div>

                        <div class="flex justify-end pt-4 border-t border-slate-100">
                            <button type="submit" id="sendEmailBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold inline-flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i><span>Send campaign</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-xl border border-slate-100 shadow-sm p-5">
                    <h3 class="font-semibold text-slate-800 mb-3">Recent campaigns</h3>
                    <div id="campaignHistory" class="space-y-2 text-sm text-slate-600 max-h-80 overflow-y-auto">
                        <p class="text-slate-400 text-xs">Loading…</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl border border-slate-100 shadow-sm p-5">
                    <h3 class="font-semibold text-slate-800 mb-3">Subscribers</h3>
                    <div id="subscriberList" class="space-y-1 text-xs text-slate-500 max-h-64 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>
</div>
