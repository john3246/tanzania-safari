<div id="page-images" class="page">
<div class="space-y-6">
    <div class="flex justify-between items-center gap-4">
        <h1 class="text-2xl font-bold text-gray-900">Media Library</h1>
        <button onclick="document.getElementById('fileUploadInput').click()" class="bg-forest-600 hover:bg-forest-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 transition-colors">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload Media
        </button>
    </div>

    <!-- Drag & Drop Zone -->
    <div 
        id="dropZone" 
        class="border-2 border-dashed rounded-xl p-12 text-center cursor-pointer transition-colors border-gray-300 hover:border-forest-400 bg-white"
        onclick="document.getElementById('fileUploadInput').click()"
    >
        <input 
            type="file" 
            id="fileUploadInput" 
            class="hidden" 
            multiple 
            accept="image/*"
        />
        <div class="mx-auto w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4 transition-colors" id="dropZoneIconBg">
            <i class="fa-solid fa-cloud-arrow-up text-gray-400 text-3xl" id="dropZoneIcon"></i>
        </div>
        <p class="text-gray-900 font-semibold mb-1" id="dropZoneText">Click or drag files to upload</p>
        <p class="text-sm text-gray-500">Supports JPG, PNG, WEBP up to 10MB</p>
    </div>

    <div class="bg-white p-4 sm:p-6 border border-gray-200 rounded-xl shadow-sm">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
            <h2 class="font-semibold text-gray-900">Uploaded Files</h2>
            <div class="relative w-full sm:w-64">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input 
                    type="text" 
                    id="mediaSearch"
                    placeholder="Search files..." 
                    class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-forest-500"
                    onkeyup="MediaManager.filterFiles()"
                />
            </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" id="mediaGrid">
            <!-- JS will populate grid here -->
        </div>
    </div>
</div>

<script>
const MediaManager = {
    files: [
        { id: '1', name: 'serengeti-lion.jpg', url: 'https://images.unsplash.com/photo-1517825738774-7de9363ef735?auto=format&fit=crop&w=400&q=80', size: '1.2 MB' },
        { id: '2', name: 'kilimanjaro.jpg', url: 'https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=400&q=80', size: '2.5 MB' },
        { id: '3', name: 'safari-jeep.jpg', url: 'https://images.unsplash.com/photo-1533423996375-f914ab160932?auto=format&fit=crop&w=400&q=80', size: '3.1 MB' },
        { id: '4', name: 'zebra-herd.jpg', url: 'https://images.unsplash.com/photo-1501704467389-13824ed22f3e?auto=format&fit=crop&w=400&q=80', size: '1.8 MB' },
        { id: '5', name: 'masai-mara.jpg', url: 'https://images.unsplash.com/photo-1602816668748-0d1fc0d13a8d?auto=format&fit=crop&w=400&q=80', size: '4.2 MB' },
    ],

    renderGrid: function() {
        const grid = document.getElementById('mediaGrid');
        const searchTerm = document.getElementById('mediaSearch').value.toLowerCase();
        
        grid.innerHTML = '';
        
        const filtered = this.files.filter(f => f.name.toLowerCase().includes(searchTerm));

        if(filtered.length === 0) {
            grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500">No media found.</div>`;
            return;
        }

        filtered.forEach(file => {
            const div = document.createElement('div');
            div.className = 'group relative bg-gray-100 rounded-lg overflow-hidden border border-gray-200 aspect-square animate-fade-in';
            div.innerHTML = `
                <img src="${file.url}" alt="${file.name}" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-between p-3">
                    <div class="flex justify-end">
                        <button onclick="MediaManager.deleteFile('${file.id}', event)" class="p-2 bg-red-500 text-white rounded hover:bg-red-600 transition-colors" title="Delete">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                    <div>
                        <p class="text-white text-xs font-medium truncate mb-1" title="${file.name}">${file.name}</p>
                        <p class="text-gray-300 text-[10px]">${file.size}</p>
                    </div>
                </div>
            `;
            grid.appendChild(div);
        });
    },

    filterFiles: function() {
        this.renderGrid();
    },

    deleteFile: function(id, e) {
        e.stopPropagation();
        if(confirm('Delete this media file?')) {
            this.files = this.files.filter(f => f.id !== id);
            this.renderGrid();
        }
    },

    handleFiles: function(newFiles) {
        if (!newFiles.length) return;
        
        const arrayFiles = Array.from(newFiles);
        const newMediaFiles = arrayFiles.map(file => ({
            id: 'm' + Date.now() + Math.random(),
            name: file.name,
            url: URL.createObjectURL(file), // create local preview url
            size: (file.size / (1024 * 1024)).toFixed(1) + ' MB'
        }));
        
        this.files = [...newMediaFiles, ...this.files];
        this.renderGrid();
    }
};

// Setup Drag & Drop Listeners
const dropZone = document.getElementById('dropZone');
const dropZoneIconBg = document.getElementById('dropZoneIconBg');
const fileUploadInput = document.getElementById('fileUploadInput');

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, preventDefaults, false);
});

function preventDefaults (e) {
    e.preventDefault();
    e.stopPropagation();
}

['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, highlight, false);
});

['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, unhighlight, false);
});

function highlight(e) {
    dropZone.classList.add('border-forest-500', 'bg-forest-50');
    dropZone.classList.remove('border-gray-300', 'bg-white');
    dropZoneIconBg.classList.add('bg-forest-100');
    dropZoneIconBg.classList.remove('bg-gray-100');
}

function unhighlight(e) {
    dropZone.classList.remove('border-forest-500', 'bg-forest-50');
    dropZone.classList.add('border-gray-300', 'bg-white');
    dropZoneIconBg.classList.remove('bg-forest-100');
    dropZoneIconBg.classList.add('bg-gray-100');
}

dropZone.addEventListener('drop', handleDrop, false);

function handleDrop(e) {
    let dt = e.dataTransfer;
    let files = dt.files;
    MediaManager.handleFiles(files);
}

fileUploadInput.addEventListener('change', function(e) {
    MediaManager.handleFiles(this.files);
    this.value = null; // reset input
});

// Initial render
MediaManager.renderGrid();

</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
    }
</style>
</div>
