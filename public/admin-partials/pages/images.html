<div id="page-images" class="page bg-slate-50 min-h-screen pb-12">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Media Library</h1>
                <p class="text-sm text-slate-500 mt-1">Manage, search, and copy slugs for all images and videos across your platform.</p>
            </div>
            <button onclick="document.getElementById('fileUploadInput').click()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-md transition-all duration-200 active:scale-95">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Media
            </button>
        </div>

        <!-- Upload Zone -->
        <div 
            id="dropZone" 
            class="border-2 border-dashed rounded-2xl p-10 text-center cursor-pointer transition-all duration-300 border-slate-300 hover:border-blue-500 bg-white hover:bg-blue-50/50 shadow-sm relative group overflow-hidden"
            onclick="document.getElementById('fileUploadInput').click()"
        >
            <input 
                type="file" 
                id="fileUploadInput" 
                class="hidden" 
                multiple 
                accept="image/*,video/*"
            />
            <div class="mx-auto w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4 transition-transform duration-300 group-hover:scale-110 text-blue-600 shadow-inner" id="dropZoneIconBg">
                <i class="fa-solid fa-cloud-arrow-up text-2xl" id="dropZoneIcon"></i>
            </div>
            <p class="text-slate-800 font-bold text-lg mb-1 transition-colors group-hover:text-blue-700" id="dropZoneText">Click or drag files to upload</p>
            <p class="text-xs text-slate-400 font-medium">Supports JPG, PNG, WEBP, SVG, MP4, WEBM, MOV up to 50MB</p>
        </div>

        <!-- Media Grid Container -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            
            <!-- Controls Bar: Filter Chips & Search -->
            <div class="flex flex-col md:flex-row items-center justify-between mb-6 gap-4 border-b border-slate-100 pb-5">
                
                <!-- Filter Chips -->
                <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto">
                    <button onclick="MediaManager.setFilter('all')" id="filterBtnAll" class="media-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition-all">
                        All Assets (<span id="countAll">0</span>)
                    </button>
                    <button onclick="MediaManager.setFilter('images')" id="filterBtnImages" class="media-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
                        <i class="fa-regular fa-image mr-1"></i> Images (<span id="countImages">0</span>)
                    </button>
                    <button onclick="MediaManager.setFilter('videos')" id="filterBtnVideos" class="media-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
                        <i class="fa-solid fa-film mr-1 text-purple-600"></i> Videos (<span id="countVideos">0</span>)
                    </button>
                </div>

                <!-- Search Input -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input 
                        type="text" 
                        id="mediaSearch"
                        placeholder="Search by name, slug, or path..." 
                        class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-900 shadow-inner"
                        onkeyup="MediaManager.filterFiles()"
                    />
                </div>
            </div>

            <!-- Grid Container -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="mediaGrid">
                <!-- Dynamic items injected here -->
            </div>
        </div>
    </div>

    <script>
    const MediaManager = {
        files: [],
        currentFilter: 'all',

        init: async function() {
            await this.loadFiles();
        },

        generateSlug: function(filename) {
            if (!filename) return 'unnamed';
            const nameWithoutExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
            return nameWithoutExt
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        },

        loadFiles: async function() {
            const grid = document.getElementById('mediaGrid');
            if (grid) {
                grid.innerHTML = '<div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-blue-500"></i><p class="font-medium">Loading Media Assets & Slugs...</p></div>';
            }
            try {
                const res = await apiRequest('GET', '/media?limit=1000');
                this.files = res.data || [];
                
                // Update Counts
                const totalCount = this.files.length;
                const videoCount = this.files.filter(f => this.isVideo(f)).length;
                const imageCount = totalCount - videoCount;

                document.getElementById('countAll').textContent = totalCount;
                document.getElementById('countImages').textContent = imageCount;
                document.getElementById('countVideos').textContent = videoCount;

                this.renderGrid();
            } catch (e) {
                console.error('Error fetching media:', e);
                showToast('Failed to load media files', 'error');
            }
        },

        isVideo: function(file) {
            const mime = (file.mime_type || '').toLowerCase();
            const ext = (file.filename || '').split('.').pop().toLowerCase();
            return mime.startsWith('video/') || ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'm4v'].includes(ext);
        },

        setFilter: function(filter) {
            this.currentFilter = filter;
            document.querySelectorAll('.media-filter-btn').forEach(btn => {
                btn.className = 'media-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all';
            });

            if (filter === 'all') document.getElementById('filterBtnAll').className = 'media-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition-all';
            if (filter === 'images') document.getElementById('filterBtnImages').className = 'media-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition-all';
            if (filter === 'videos') document.getElementById('filterBtnVideos').className = 'media-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-purple-900 text-white shadow-sm transition-all';

            this.renderGrid();
        },

        renderGrid: function() {
            const grid = document.getElementById('mediaGrid');
            if (!grid) return;
            const searchTerm = (document.getElementById('mediaSearch')?.value || '').toLowerCase();
            
            grid.innerHTML = '';
            
            const filtered = this.files.filter(f => {
                const isVid = this.isVideo(f);
                if (this.currentFilter === 'images' && isVid) return false;
                if (this.currentFilter === 'videos' && !isVid) return false;

                const slug = f.slug || this.generateSlug(f.filename);
                return (f.filename || '').toLowerCase().includes(searchTerm) || 
                       (f.original_name || '').toLowerCase().includes(searchTerm) ||
                       (f.url || '').toLowerCase().includes(searchTerm) ||
                       slug.toLowerCase().includes(searchTerm);
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 flex flex-col items-center justify-center text-slate-400"><i class="fa-regular fa-folder-open text-5xl mb-4 text-slate-300"></i><p class="text-slate-500 font-medium">No media found matching criteria.</p></div>`;
                return;
            }

            const html = filtered.map(file => {
                const sizeMB = file.file_size ? (file.file_size / (1024 * 1024)).toFixed(2) + ' MB' : '—';
                const mediaUrl = file.url || `/uploads/${file.filename}`;
                const encodedUrl = encodeURI(mediaUrl);
                const fileSlug = file.slug || this.generateSlug(file.filename);
                const isVid = this.isVideo(file);

                const typeBadge = isVid 
                    ? '<span class="absolute top-2 left-2 bg-purple-600 text-white text-[9px] font-extrabold px-2 py-0.5 rounded shadow-sm uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-play text-[8px]"></i> VIDEO</span>'
                    : '<span class="absolute top-2 left-2 bg-blue-600 text-white text-[9px] font-extrabold px-2 py-0.5 rounded shadow-sm uppercase tracking-wider">IMAGE</span>';

                let previewHtml = '';
                if (isVid) {
                    previewHtml = `
                        <div class="relative w-full h-full flex items-center justify-center bg-slate-950">
                            <video src="${encodedUrl}" muted preload="metadata" class="w-full h-full object-cover opacity-80"></video>
                            <div class="absolute w-10 h-10 rounded-full bg-purple-600/90 text-white flex items-center justify-center shadow-lg transform group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-play text-sm ml-0.5"></i>
                            </div>
                        </div>
                    `;
                } else {
                    previewHtml = `<img src="${encodedUrl}" alt="${file.filename}" class="w-full h-full object-cover drop-shadow-sm transition-transform duration-500 group-hover:scale-105" onerror="this.onerror=null; this.src='/images/optimized/balloon.webp'">`;
                }
                
                return `
                    <div class="group relative bg-white rounded-xl overflow-hidden border border-slate-200 aspect-[4/5] animate-fade-in flex flex-col shadow-sm hover:shadow-xl hover:border-slate-300 transition-all duration-300">
                        <!-- Media Preview Box -->
                        <div class="flex-1 w-full overflow-hidden bg-slate-100 flex items-center justify-center relative">
                            ${previewHtml}
                            ${typeBadge}
                            
                            <!-- Hover Action Overlay -->
                            <div class="absolute inset-0 bg-slate-900/70 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center gap-2 backdrop-blur-[2px] p-2">
                                <button data-slug="${fileSlug}" onclick="MediaManager.copyText(this.dataset.slug, 'Slug copied to clipboard!', event)" class="w-9 h-9 flex items-center justify-center bg-purple-600 text-white rounded-full hover:bg-purple-700 transition-all shadow-lg transform translate-y-4 group-hover:translate-y-0" title="Copy Slug: ${fileSlug}">
                                    <i class="fa-solid fa-code text-xs"></i>
                                </button>
                                <button data-url="${encodedUrl}" onclick="MediaManager.copyText(this.dataset.url, 'Link copied to clipboard!', event)" class="w-9 h-9 flex items-center justify-center bg-white text-slate-700 rounded-full hover:bg-blue-50 hover:text-blue-600 transition-all shadow-lg transform translate-y-4 group-hover:translate-y-0 delay-75" title="Copy URL">
                                    <i class="fa-solid fa-link text-xs"></i>
                                </button>
                                <button data-id="${file.id}" onclick="MediaManager.deleteFile(this.dataset.id, event)" class="w-9 h-9 flex items-center justify-center bg-red-500 text-white rounded-full hover:bg-red-600 transition-all shadow-lg transform translate-y-4 group-hover:translate-y-0 delay-100" title="Delete File">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Card Footer Details -->
                        <div class="p-3 bg-white border-t border-slate-100 shrink-0">
                            <p class="text-slate-900 text-xs font-bold truncate mb-1" title="${file.filename}">${file.filename}</p>
                            
                            <!-- Slug Badge -->
                            <div class="mb-1.5 flex items-center gap-1">
                                <span class="text-[10px] font-mono font-bold bg-purple-100 text-purple-900 px-2 py-0.5 rounded truncate max-w-full border border-purple-200/80 cursor-pointer hover:bg-purple-200" title="Click to copy slug: ${fileSlug}" onclick="MediaManager.copyText('${fileSlug}', 'Slug copied!', event)">
                                    slug: ${fileSlug}
                                </span>
                            </div>

                            <div class="flex items-center justify-between text-[10px]">
                                <p class="text-slate-400 font-medium truncate pr-2" title="${mediaUrl}">${mediaUrl}</p>
                                <p class="text-slate-600 font-bold bg-slate-100 px-1.5 py-0.5 rounded shrink-0">${sizeMB}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            grid.innerHTML = html;
        },

        filterFiles: function() {
            this.renderGrid();
        },

        copyText: function(text, successMsg, e) {
            if (e) e.stopPropagation();
            const absoluteText = (text.startsWith('/') && !text.startsWith('http')) ? window.location.origin + text : text;
            navigator.clipboard.writeText(absoluteText).then(() => {
                showToast(successMsg || 'Copied to clipboard!', 'success');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        },

        deleteFile: async function(id, e) {
            if (e) e.stopPropagation();
            if(!confirm('Are you sure you want to delete this media file permanently?')) return;
            try {
                await apiRequest('DELETE', `/media/${id}`);
                showToast('Media file deleted successfully', 'success');
                await this.loadFiles();
            } catch (e) {
                console.error(e);
                showToast('Failed to delete media file', 'error');
            }
        },

        handleFiles: async function(newFiles) {
            if (!newFiles.length) return;
            
            const arrayFiles = Array.from(newFiles);
            showToast('Uploading files...', 'success');

            try {
                for (const file of arrayFiles) {
                    const formData = new FormData();
                    formData.append('image', file);
                    formData.append('folder', 'general');
                    formData.append('original_filename', file.name);
                    await apiUpload(formData);
                }
                showToast('All files uploaded successfully', 'success');
                await this.loadFiles();
            } catch (e) {
                console.error(e);
                showToast('Failed to upload files', 'error');
            }
        }
    };

    // Setup Drag & Drop Listeners
    const dropZone = document.getElementById('dropZone');
    const dropZoneIconBg = document.getElementById('dropZoneIconBg');
    const fileUploadInput = document.getElementById('fileUploadInput');

    if (dropZone) {
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('border-blue-500', 'bg-blue-50/50');
            dropZone.classList.remove('border-slate-300', 'bg-white');
            dropZoneIconBg.classList.add('bg-blue-100', 'scale-110');
            dropZoneIconBg.classList.remove('bg-blue-50');
        }

        function unhighlight(e) {
            dropZone.classList.remove('border-blue-500', 'bg-blue-50/50');
            dropZone.classList.add('border-slate-300', 'bg-white');
            dropZoneIconBg.classList.remove('bg-blue-100', 'scale-110');
            dropZoneIconBg.classList.add('bg-blue-50');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            MediaManager.handleFiles(files);
        }
    }

    if (fileUploadInput) {
        fileUploadInput.addEventListener('change', function(e) {
            MediaManager.handleFiles(this.files);
            this.value = null; // reset input
        });
    }

    window.loadImages = function() {
        MediaManager.init();
    };

    // Initial run if already injected
    if (document.getElementById('page-images')) {
        MediaManager.init();
    }
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</div>
