<div id="page-images" class="page bg-slate-100 min-h-screen pb-12 font-sans text-slate-900">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-md border-2 border-slate-200">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Media Library (Images & Videos)</h1>
                <p class="text-xs text-slate-600 font-bold mt-1">Manage, search, and copy slugs for all images and videos across your platform.</p>
            </div>
            <button onclick="document.getElementById('fileUploadInput').click()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl text-xs font-black flex items-center justify-center gap-2 shadow-md transition-all active:scale-95 uppercase tracking-wide cursor-pointer">
                <i class="fa-solid fa-cloud-arrow-up text-sm"></i> UPLOAD MEDIA
            </button>
        </div>

        <!-- Upload Zone -->
        <div 
            id="dropZone" 
            class="border-3 border-dashed rounded-2xl p-8 text-center cursor-pointer transition-all border-slate-400 bg-white hover:bg-slate-50 shadow-sm relative group overflow-hidden"
            onclick="document.getElementById('fileUploadInput').click()"
        >
            <input 
                type="file" 
                id="fileUploadInput" 
                class="hidden" 
                multiple 
                accept="image/*,video/*"
            />
            <div class="mx-auto w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center mb-3 text-white shadow-md" id="dropZoneIconBg">
                <i class="fa-solid fa-cloud-arrow-up text-2xl" id="dropZoneIcon"></i>
            </div>
            <p class="text-slate-900 font-black text-base mb-1" id="dropZoneText">CLICK OR DRAG FILES TO UPLOAD</p>
            <p class="text-xs text-slate-600 font-bold">Supports JPG, PNG, WEBP, SVG, MP4, WEBM, MOV up to 50MB</p>
        </div>

        <!-- Media Grid Container -->
        <div class="bg-white p-6 rounded-2xl shadow-md border-2 border-slate-200 space-y-6">
            
            <!-- Controls Bar: Filter Chips & Search -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 border-b-2 border-slate-200 pb-5">
                
                <!-- Filter Chips -->
                <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto">
                    <button onclick="MediaManager.setFilter('all')" id="filterBtnAll" class="media-filter-btn px-4 py-2.5 rounded-xl text-xs font-black bg-slate-900 text-white shadow-sm transition-all uppercase tracking-wider">
                        ALL ASSETS (<span id="countAll">0</span>)
                    </button>
                    <button onclick="MediaManager.setFilter('images')" id="filterBtnImages" class="media-filter-btn px-4 py-2.5 rounded-xl text-xs font-black bg-slate-200 text-slate-800 hover:bg-slate-300 transition-all uppercase tracking-wider">
                        <i class="fa-regular fa-image mr-1"></i> IMAGES (<span id="countImages">0</span>)
                    </button>
                    <button onclick="MediaManager.setFilter('videos')" id="filterBtnVideos" class="media-filter-btn px-4 py-2.5 rounded-xl text-xs font-black bg-slate-200 text-slate-800 hover:bg-slate-300 transition-all uppercase tracking-wider">
                        <i class="fa-solid fa-film mr-1 text-purple-700"></i> VIDEOS (<span id="countVideos">0</span>)
                    </button>
                </div>

                <!-- Search Input -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input 
                        type="text" 
                        id="mediaSearch"
                        placeholder="Search filename, slug, or path..." 
                        class="w-full pl-11 pr-4 py-2.5 bg-slate-100 border-2 border-slate-300 rounded-xl text-xs font-bold text-slate-900 focus:outline-none focus:border-slate-900 transition-all"
                        onkeyup="MediaManager.filterFiles()"
                    />
                </div>
            </div>

            <!-- Grid Container -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="mediaGrid">
                <!-- Dynamic items injected here -->
            </div>
        </div>
    </div>

    <script>
    const MediaManager = {
        files: [],
        currentFilter: 'all',

        init: async function() {
            await this.loadFiles();
        },

        generateSlug: function(filename) {
            if (!filename) return 'unnamed';
            const nameWithoutExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
            return nameWithoutExt
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        },

        loadFiles: async function() {
            const grid = document.getElementById('mediaGrid');
            if (grid) {
                grid.innerHTML = '<div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-500 font-bold"><i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-slate-900"></i><p class="font-black text-sm">LOADING MEDIA ASSETS & SLUGS...</p></div>';
            }
            try {
                const res = await apiRequest('GET', '/media?limit=1000');
                this.files = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);
                
                // Update Counts
                const totalCount = this.files.length;
                const videoCount = this.files.filter(f => this.isVideo(f)).length;
                const imageCount = totalCount - videoCount;

                const cAll = document.getElementById('countAll');
                const cImg = document.getElementById('countImages');
                const cVid = document.getElementById('countVideos');
                if (cAll) cAll.textContent = totalCount;
                if (cImg) cImg.textContent = imageCount;
                if (cVid) cVid.textContent = videoCount;

                this.renderGrid();
            } catch (e) {
                console.error('Error fetching media:', e);
                if (grid) {
                    grid.innerHTML = '<div class="col-span-full py-16 flex flex-col items-center justify-center text-red-600 font-black"><i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i><p>Failed to load media files.</p></div>';
                }
            }
        },

        isVideo: function(file) {
            const mime = (file.mime_type || '').toLowerCase();
            const ext = (file.filename || '').split('.').pop().toLowerCase();
            return mime.startsWith('video/') || ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'm4v'].includes(ext);
        },

        setFilter: function(filter) {
            this.currentFilter = filter;
            document.querySelectorAll('.media-filter-btn').forEach(btn => {
                btn.className = 'media-filter-btn px-4 py-2.5 rounded-xl text-xs font-black bg-slate-200 text-slate-800 hover:bg-slate-300 transition-all uppercase tracking-wider';
            });

            if (filter === 'all') document.getElementById('filterBtnAll').className = 'media-filter-btn px-4 py-2.5 rounded-xl text-xs font-black bg-slate-900 text-white shadow-sm transition-all uppercase tracking-wider';
            if (filter === 'images') document.getElementById('filterBtnImages').className = 'media-filter-btn px-4 py-2.5 rounded-xl text-xs font-black bg-slate-900 text-white shadow-sm transition-all uppercase tracking-wider';
            if (filter === 'videos') document.getElementById('filterBtnVideos').className = 'media-filter-btn px-4 py-2.5 rounded-xl text-xs font-black bg-purple-900 text-white shadow-sm transition-all uppercase tracking-wider';

            this.renderGrid();
        },

        renderGrid: function() {
            const grid = document.getElementById('mediaGrid');
            if (!grid) return;
            const searchTerm = (document.getElementById('mediaSearch')?.value || '').toLowerCase();
            
            grid.innerHTML = '';
            
            const filtered = this.files.filter(f => {
                const isVid = this.isVideo(f);
                if (this.currentFilter === 'images' && isVid) return false;
                if (this.currentFilter === 'videos' && !isVid) return false;

                const slug = f.slug || this.generateSlug(f.filename);
                return (f.filename || '').toLowerCase().includes(searchTerm) || 
                       (f.original_name || '').toLowerCase().includes(searchTerm) ||
                       (f.url || '').toLowerCase().includes(searchTerm) ||
                       slug.toLowerCase().includes(searchTerm);
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 flex flex-col items-center justify-center text-slate-500 font-bold"><i class="fa-regular fa-folder-open text-5xl mb-4 text-slate-400"></i><p class="text-slate-700 font-extrabold">No media found matching criteria.</p></div>`;
                return;
            }

            const html = filtered.map(file => {
                const sizeMB = file.file_size ? (file.file_size / (1024 * 1024)).toFixed(2) + ' MB' : '—';
                const mediaUrl = file.url || `/uploads/${file.filename}`;
                const encodedUrl = encodeURI(mediaUrl);
                const fileSlug = file.slug || this.generateSlug(file.filename);
                const isVid = this.isVideo(file);

                const typeBadge = isVid 
                    ? '<span class="absolute top-2 left-2 bg-purple-900 text-white text-[10px] font-black px-2.5 py-1 rounded-md shadow uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-play text-[9px]"></i> VIDEO</span>'
                    : '<span class="absolute top-2 left-2 bg-slate-900 text-white text-[10px] font-black px-2.5 py-1 rounded-md shadow uppercase tracking-wider">IMAGE</span>';

                let previewHtml = '';
                if (isVid) {
                    previewHtml = `
                        <div class="relative w-full h-44 bg-slate-950 flex items-center justify-center overflow-hidden">
                            <video src="${encodedUrl}" muted preload="metadata" class="w-full h-full object-cover"></video>
                            <div class="absolute w-12 h-12 rounded-full bg-purple-600 text-white flex items-center justify-center shadow-lg">
                                <i class="fa-solid fa-play text-base ml-0.5"></i>
                            </div>
                        </div>
                    `;
                } else {
                    previewHtml = `<div class="w-full h-44 bg-slate-100 flex items-center justify-center overflow-hidden"><img src="${encodedUrl}" alt="${file.filename}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='/images/optimized/balloon.webp'"></div>`;
                }
                
                return `
                    <div class="bg-white rounded-2xl overflow-hidden border-2 border-slate-300 flex flex-col shadow-md hover:shadow-xl transition-all">
                        <!-- Media Preview Box -->
                        <div class="w-full relative shrink-0">
                            ${previewHtml}
                            ${typeBadge}
                        </div>
                        
                        <!-- Card Details & Actions (Solid Solid High Visibility) -->
                        <div class="p-4 bg-white space-y-3 flex-1 flex flex-col justify-between border-t-2 border-slate-200">
                            <div>
                                <p class="text-slate-900 text-xs font-black truncate mb-1" title="${file.filename}">${file.filename}</p>
                                
                                <!-- Slug Badge -->
                                <div class="my-2">
                                    <button 
                                        onclick="MediaManager.copyText('${fileSlug}', 'Slug copied!', event)"
                                        class="w-full bg-purple-100 hover:bg-purple-200 border-2 border-purple-300 text-purple-950 font-mono font-black text-[11px] px-2.5 py-1 rounded-lg text-left truncate flex items-center justify-between gap-1 transition-all"
                                        title="Click to copy slug: ${fileSlug}"
                                    >
                                        <span class="truncate">slug: ${fileSlug}</span>
                                        <i class="fa-solid fa-copy text-xs text-purple-700"></i>
                                    </button>
                                </div>

                                <div class="flex items-center justify-between text-[11px] font-bold text-slate-500">
                                    <span class="truncate max-w-[140px]" title="${mediaUrl}">${mediaUrl}</span>
                                    <span class="bg-slate-200 text-slate-900 px-2 py-0.5 rounded font-black">${sizeMB}</span>
                                </div>
                            </div>

                            <!-- Solid Action Buttons Bar -->
                            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200">
                                <button 
                                    data-url="${encodedUrl}" 
                                    onclick="MediaManager.copyText(this.dataset.url, 'URL copied!', event)" 
                                    class="bg-blue-700 hover:bg-blue-800 text-white font-black text-xs py-2 rounded-xl flex items-center justify-center gap-1.5 shadow transition-all active:scale-95"
                                >
                                    <i class="fa-solid fa-link text-xs"></i> COPY URL
                                </button>
                                <button 
                                    data-id="${file.id}" 
                                    onclick="MediaManager.deleteFile(this.dataset.id, event)" 
                                    class="bg-red-600 hover:bg-red-700 text-white font-black text-xs py-2 rounded-xl flex items-center justify-center gap-1.5 shadow transition-all active:scale-95"
                                >
                                    <i class="fa-solid fa-trash text-xs"></i> DELETE
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            grid.innerHTML = html;
        },

        filterFiles: function() {
            this.renderGrid();
        },

        copyText: function(text, successMsg, e) {
            if (e) e.stopPropagation();
            const absoluteText = (text.startsWith('/') && !text.startsWith('http')) ? window.location.origin + text : text;
            navigator.clipboard.writeText(absoluteText).then(() => {
                if (typeof showToast === 'function') showToast(successMsg || 'Copied to clipboard!', 'success');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        },

        deleteFile: async function(id, e) {
            if (e) e.stopPropagation();
            if(!confirm('Are you sure you want to delete this media file permanently?')) return;
            try {
                await apiRequest('DELETE', `/media/${id}`);
                if (typeof showToast === 'function') showToast('Media file deleted successfully', 'success');
                await this.loadFiles();
            } catch (e) {
                console.error(e);
                if (typeof showToast === 'function') showToast('Failed to delete media file', 'error');
            }
        },

        handleFiles: async function(newFiles) {
            if (!newFiles.length) return;
            
            const arrayFiles = Array.from(newFiles);
            if (typeof showToast === 'function') showToast('Uploading files...', 'success');

            try {
                for (const file of arrayFiles) {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('folder', 'general');
                    formData.append('original_filename', file.name);
                    await apiUpload(formData);
                }
                if (typeof showToast === 'function') showToast('All files uploaded successfully', 'success');
                await this.loadFiles();
            } catch (e) {
                console.error(e);
                if (typeof showToast === 'function') showToast('Failed to upload files', 'error');
            }
        }
    };

    // Setup Drag & Drop Listeners
    const dropZone = document.getElementById('dropZone');
    const fileUploadInput = document.getElementById('fileUploadInput');

    if (dropZone) {
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;
            MediaManager.handleFiles(files);
        }, false);
    }

    if (fileUploadInput) {
        fileUploadInput.addEventListener('change', function(e) {
            MediaManager.handleFiles(this.files);
            this.value = null; // reset input
        });
    }

    window.loadImages = function() {
        MediaManager.init();
    };

    // Initial run if already injected
    if (document.getElementById('page-images')) {
        MediaManager.init();
    }
    </script>
</div>
