<div id="page-images" class="page">
<div class="space-y-6">
    <div class="flex justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Media Library</h1>
            <p class="text-xs text-gray-500 mt-1">Upload and manage visual assets for your tours, destinations, and blog posts.</p>
        </div>
        <button onclick="document.getElementById('fileUploadInput').click()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 shadow-sm transition-all duration-200">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload Media
        </button>
    </div>

    <!-- Drag & Drop Zone -->
    <div 
        id="dropZone" 
        class="border-2 border-dashed rounded-xl p-10 text-center cursor-pointer transition-colors border-gray-200 hover:border-emerald-500 bg-white shadow-sm"
        onclick="document.getElementById('fileUploadInput').click()"
    >
        <input 
            type="file" 
            id="fileUploadInput" 
            class="hidden" 
            multiple 
            accept="image/*"
        />
        <div class="mx-auto w-14 h-14 bg-emerald-50 rounded-full flex items-center justify-center mb-4 transition-colors text-emerald-600" id="dropZoneIconBg">
            <i class="fa-solid fa-cloud-arrow-up text-2xl" id="dropZoneIcon"></i>
        </div>
        <p class="text-gray-750 font-bold mb-1" id="dropZoneText">Click or drag files to upload</p>
        <p class="text-xs text-gray-400">Supports JPG, PNG, WEBP up to 10MB</p>
    </div>

    <div class="bg-white p-6 border border-gray-200 rounded-xl shadow-sm">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4 border-b border-gray-100 pb-4">
            <h2 class="font-bold text-gray-800 text-lg">Uploaded Files</h2>
            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input 
                    type="text" 
                    id="mediaSearch"
                    placeholder="Search files..." 
                    class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-gray-900"
                    onkeyup="MediaManager.filterFiles()"
                />
            </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" id="mediaGrid">
            <!-- Dynamic items -->
        </div>
    </div>
</div>

<script>
const MediaManager = {
    files: [],

    init: async function() {
        await this.loadFiles();
    },

    loadFiles: async function() {
        const grid = document.getElementById('mediaGrid');
        if (grid) {
            grid.innerHTML = '<div class="col-span-full py-12 text-center text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> Loading media library...</div>';
        }
        try {
            const res = await apiRequest('GET', '/media');
            this.files = res.data || [];
            this.renderGrid();
        } catch (e) {
            console.error('Error fetching media:', e);
            showToast('Failed to load media files', 'error');
        }
    },

    renderGrid: function() {
        const grid = document.getElementById('mediaGrid');
        if (!grid) return;
        const searchTerm = document.getElementById('mediaSearch')?.value.toLowerCase() || '';
        
        grid.innerHTML = '';
        
        const filtered = this.files.filter(f => 
            (f.filename || '').toLowerCase().includes(searchTerm) || 
            (f.original_name || '').toLowerCase().includes(searchTerm) ||
            (f.alt_text || '').toLowerCase().includes(searchTerm)
        );

        if(filtered.length === 0) {
            grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500">No media found.</div>`;
            return;
        }

        filtered.forEach(file => {
            const sizeMB = file.file_size ? (file.file_size / (1024 * 1024)).toFixed(2) + ' MB' : '—';
            const imgUrl = file.url || `/uploads/${file.filename}`;
            const div = document.createElement('div');
            div.className = 'group relative bg-slate-50 rounded-lg overflow-hidden border border-slate-200 aspect-square animate-fade-in flex flex-col shadow-sm';
            div.innerHTML = `
                <div class="flex-1 w-full overflow-hidden bg-slate-100 flex items-center justify-center relative">
                    <img src="${imgUrl}" alt="${file.alt_text || file.filename}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" onerror="this.src='/images/optimized/balloon.webp'">
                    <div class="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                        <button onclick="MediaManager.copyUrl('${imgUrl}', event)" class="p-2 bg-white text-slate-700 rounded-lg hover:bg-emerald-50 hover:text-emerald-600 transition-all shadow-md" title="Copy URL">
                            <i class="fa-solid fa-link text-sm"></i>
                        </button>
                        <button onclick="MediaManager.deleteFile('${file.id}', event)" class="p-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-all shadow-md" title="Delete">
                            <i class="fa-solid fa-trash text-sm"></i>
                        </button>
                    </div>
                </div>
                <div class="p-3 bg-white border-t border-slate-100 shrink-0">
                    <p class="text-slate-800 text-xs font-bold truncate" title="${file.original_name || file.filename}">${file.original_name || file.filename}</p>
                    <div class="flex items-center justify-between mt-1">
                        <p class="text-slate-400 text-[10px] truncate" title="Slug: ${file.filename}">${file.filename}</p>
                        <p class="text-slate-500 text-[10px] font-semibold">${sizeMB}</p>
                    </div>
                </div>
            `;
            grid.appendChild(div);
        });
    },

    filterFiles: function() {
        this.renderGrid();
    },

    copyUrl: function(url, e) {
        e.stopPropagation();
        // Resolve absolute URL if it is relative
        const absoluteUrl = url.startsWith('http') ? url : window.location.origin + url;
        navigator.clipboard.writeText(absoluteUrl).then(() => {
            showToast('URL copied to clipboard');
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    },

    deleteFile: async function(id, e) {
        e.stopPropagation();
        if(!confirm('Are you sure you want to delete this media file permanently?')) return;
        try {
            await apiRequest('DELETE', `/media/${id}`);
            showToast('Media file deleted successfully');
            await this.loadFiles();
        } catch (e) {
            console.error(e);
            showToast('Failed to delete media file', 'error');
        }
    },

    handleFiles: async function(newFiles) {
        if (!newFiles.length) return;
        
        const arrayFiles = Array.from(newFiles);
        const uploadProgress = showToast('Uploading files...', 'success');

        try {
            for (const file of arrayFiles) {
                const formData = new FormData();
                formData.append('image', file);
                formData.append('folder', 'general');
                formData.append('original_filename', file.name);
                await apiUpload(formData);
            }
            showToast('All files uploaded successfully');
            await this.loadFiles();
        } catch (e) {
            console.error(e);
            showToast('Failed to upload files', 'error');
        }
    }
};

// Setup Drag & Drop Listeners
const dropZone = document.getElementById('dropZone');
const dropZoneIconBg = document.getElementById('dropZoneIconBg');
const fileUploadInput = document.getElementById('fileUploadInput');

if (dropZone) {
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults (e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, unhighlight, false);
    });

    function highlight(e) {
        dropZone.classList.add('border-emerald-500', 'bg-emerald-50/50');
        dropZone.classList.remove('border-gray-200', 'bg-white');
        dropZoneIconBg.classList.add('bg-emerald-100');
        dropZoneIconBg.classList.remove('bg-emerald-50');
    }

    function unhighlight(e) {
        dropZone.classList.remove('border-emerald-500', 'bg-emerald-50/50');
        dropZone.classList.add('border-gray-200', 'bg-white');
        dropZoneIconBg.classList.remove('bg-emerald-100');
        dropZoneIconBg.classList.add('bg-emerald-50');
    }

    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
        let dt = e.dataTransfer;
        let files = dt.files;
        MediaManager.handleFiles(files);
    }
}

if (fileUploadInput) {
    fileUploadInput.addEventListener('change', function(e) {
        MediaManager.handleFiles(this.files);
        this.value = null; // reset input
    });
}

// Map global loadImages callback to trigger MediaManager init
window.loadImages = function() {
    MediaManager.init();
};

// Initial run if already injected
MediaManager.init();
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
    }
</style>
</div>
