<div id="page-customers" class="page">
    <div class="space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Customer CRM</h1>
                <p class="text-sm text-gray-500 mt-1">Visitors from newsletter, live chat, enquiries, and bookings.</p>
            </div>
        </div>

        <div class="bg-white p-4 border border-gray-200 rounded-xl shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input 
                    type="text" 
                    id="customerSearch"
                    placeholder="Search name or email..." 
                    class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-gray-900"
                    onkeyup="filterCustomers()"
                />
            </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-400 text-xs font-semibold uppercase tracking-wider border-b border-gray-150">
                        <tr>
                            <th class="px-6 py-4">Customer</th>
                            <th class="px-6 py-4">Email</th>
                            <th class="px-6 py-4">Phone</th>
                            <th class="px-6 py-4">Source</th>
                            <th class="px-6 py-4">Updated</th>
                        </tr>
                    </thead>
                    <tbody id="customerBody" class="divide-y divide-gray-100 bg-white"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
async function loadCustomers() {
    const body = document.getElementById('customerBody');
    if (!body) return;
    body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> Loading customers...</td></tr>';
    try {
        const res = await apiRequest('GET', '/customers');
        window.allCustomersList = res.data || [];
        renderCustomers(window.allCustomersList);
    } catch (e) {
        console.error(e);
        showToast('Failed to load customers', 'error');
        body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Failed to load customers</td></tr>';
    }
}

function renderCustomers(list) {
    const body = document.getElementById('customerBody');
    if (!body) return;
    if (!list.length) {
        body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">No customers yet. Newsletter, chat, enquiries and bookings will appear here.</td></tr>';
        return;
    }
    body.innerHTML = list.map(c => `
        <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100">
            <td class="px-6 py-4 font-semibold text-slate-800">${escapeHtml(c.name || '—')}</td>
            <td class="px-6 py-4 text-slate-500">${escapeHtml(c.email)}</td>
            <td class="px-6 py-4 text-slate-500">${escapeHtml(c.phone || '—')}</td>
            <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs font-medium rounded-full bg-emerald-100 text-emerald-700">${escapeHtml(c.source || 'website')}</span></td>
            <td class="px-6 py-4 text-slate-400 text-xs">${c.updated_at ? new Date(c.updated_at).toLocaleString() : '—'}</td>
        </tr>
    `).join('');
}

function filterCustomers() {
    const q = (document.getElementById('customerSearch')?.value || '').toLowerCase();
    const list = (window.allCustomersList || []).filter(c =>
        (c.name || '').toLowerCase().includes(q) ||
        (c.email || '').toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q)
    );
    renderCustomers(list);
}

window.loadCustomers = loadCustomers;
</script>
