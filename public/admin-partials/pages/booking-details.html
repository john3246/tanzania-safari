<div id="page-booking-details" class="page w-full">
    <div class="max-w-5xl mx-auto w-full space-y-8 pb-12">
        <!-- Header Section -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <button onclick="navigate('bookings')" class="text-sm font-semibold text-slate-500 hover:text-primary-600 mb-3 inline-flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> Back to Bookings
                </button>
                <div class="flex items-center gap-3">
                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
                        Booking <span id="detailBookingId" class="text-primary-600"></span>
                    </h1>
                    <span id="detailStatusBadge" class="ml-2"></span>
                </div>
            </div>
            <div class="flex gap-3">
                <button id="btnApproveBooking" class="bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/20 px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Approve
                </button>
                <button id="btnRejectBooking" class="bg-red-500 hover:bg-red-600 text-white shadow-lg shadow-red-500/20 px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-times"></i> Reject
                </button>
                <button id="btnPendingBooking" class="bg-amber-500 hover:bg-amber-600 text-white shadow-lg shadow-amber-500/20 px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-clock"></i> Pending
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Details & Communication -->
            <div class="lg:col-span-2 space-y-8">
                
                <!-- Trip Information Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-primary-100 text-primary-600 flex items-center justify-center">
                                <i class="fa-solid fa-map-location-dot"></i>
                            </div>
                            Trip Information
                        </h2>
                    </div>
                    <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-y-6 gap-x-8">
                        <div class="space-y-1.5">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Package</p>
                            <p id="detailPackageName" class="font-semibold text-slate-800 text-base"></p>
                        </div>
                        <div class="space-y-1.5">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Start Date</p>
                            <p id="detailStartDate" class="font-semibold text-slate-800 text-base"></p>
                        </div>
                        <div class="space-y-1.5">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Guests</p>
                            <p class="font-semibold text-slate-800 text-base"><span id="detailAdults"></span> Adults, <span id="detailChildren"></span> Children</p>
                        </div>
                        <div class="space-y-1.5">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Price</p>
                            <p id="detailPrice" class="font-extrabold text-emerald-600 text-xl"></p>
                        </div>
                        <div class="sm:col-span-2 space-y-2 mt-2">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Special Requests</p>
                            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                <p id="detailSpecialRequests" class="text-slate-700 text-sm leading-relaxed"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Customer Communication Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
                                <i class="fa-solid fa-envelope-open-text"></i>
                            </div>
                            Message Customer
                        </h2>
                    </div>
                    <div class="p-6">
                        <form id="bookingReplyForm" class="space-y-5">
                            <div class="space-y-1.5">
                                <label class="block text-sm font-bold text-slate-700">Subject</label>
                                <input type="text" id="replySubject" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 outline-none transition-all font-medium text-slate-800" placeholder="Update on your Safari Booking">
                            </div>
                            <div class="space-y-1.5">
                                <label class="block text-sm font-bold text-slate-700">Message <span class="text-red-500">*</span></label>
                                <textarea id="replyMessage" rows="5" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 outline-none transition-all resize-none font-medium text-slate-800" placeholder="Type your message to the customer here..." required></textarea>
                            </div>
                            <div class="flex justify-end pt-2">
                                <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-lg shadow-primary-600/20 flex items-center gap-2">
                                    <i class="fa-solid fa-paper-plane"></i> Send Message
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

            <!-- Right Column: Customer Info Sidebar -->
            <div class="space-y-8">
                <!-- Customer Details Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden sticky top-8">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center">
                                <i class="fa-solid fa-user-astronaut"></i>
                            </div>
                            Customer Profile
                        </h2>
                    </div>
                    <div class="p-6">
                        <div class="flex flex-col items-center text-center mb-6">
                            <div class="w-20 h-20 rounded-full bg-gradient-to-br from-primary-100 to-primary-200 text-primary-700 flex items-center justify-center text-3xl font-bold mb-4 shadow-inner border-2 border-white ring-4 ring-slate-50">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <h3 id="detailCustomerName" class="font-extrabold text-slate-900 text-xl"></h3>
                            <span class="text-xs font-semibold text-primary-600 bg-primary-50 px-3 py-1 rounded-full mt-2">Primary Guest</span>
                        </div>

                        <div class="space-y-4 pt-4 border-t border-slate-100">
                            <div class="flex items-center gap-4 p-3 rounded-xl hover:bg-slate-50 transition-colors">
                                <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">
                                    <i class="fa-regular fa-envelope"></i>
                                </div>
                                <div class="overflow-hidden">
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-0.5">Email Address</p>
                                    <a id="detailCustomerEmail" href="#" class="text-slate-800 font-semibold hover:text-primary-600 transition-colors truncate block"></a>
                                </div>
                            </div>

                            <div class="flex items-center gap-4 p-3 rounded-xl hover:bg-slate-50 transition-colors">
                                <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-0.5">Phone Number</p>
                                    <p id="detailCustomerPhone" class="text-slate-800 font-semibold"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
