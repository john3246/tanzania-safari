<div id="page-booking-details" class="page fixed inset-0 z-[100] bg-gray-50 flex flex-col overflow-hidden">
    <!-- Header Section -->
    <div class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-4">
            <button onclick="navigate('bookings')" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 hover:text-gray-900 transition-colors">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold text-gray-900">
                        Booking <span id="detailBookingId" class="text-primary-600"></span>
                    </h1>
                    <span id="detailStatusBadge" class="ml-2"></span>
                </div>
                <p class="text-sm text-gray-500 mt-1">Manage booking details and communicate with the customer.</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button id="btnApproveBooking" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2">
                <i class="fa-solid fa-check"></i> Approve
            </button>
            <button id="btnRejectBooking" class="bg-red-50 text-red-700 hover:bg-red-100 border border-red-200 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2">
                <i class="fa-solid fa-times"></i> Reject
            </button>
            <button id="btnPendingBooking" class="bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2">
                <i class="fa-solid fa-clock"></i> Pending
            </button>
        </div>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto p-6 lg:p-8 w-full">
        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Trip Info & Communication -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Trip Information -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-primary-50 text-primary-600 flex items-center justify-center">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </div>
                        <h2 class="text-lg font-bold text-gray-800">Trip Information</h2>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Package Name</p>
                                <p id="detailPackageName" class="font-medium text-gray-900 text-base"></p>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Start Date</p>
                                <p id="detailStartDate" class="font-medium text-gray-900 text-base"></p>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Guests</p>
                                <p class="font-medium text-gray-900 text-base"><span id="detailAdults"></span> Adults, <span id="detailChildren"></span> Children</p>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Total Price</p>
                                <p id="detailPrice" class="font-bold text-emerald-600 text-xl"></p>
                            </div>
                            <div class="sm:col-span-2 mt-2">
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Special Requests</p>
                                <div class="bg-gray-50 rounded-lg p-4 border border-gray-100">
                                    <p id="detailSpecialRequests" class="text-gray-700 text-sm whitespace-pre-wrap"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Communication -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                            <i class="fa-solid fa-envelope-open-text"></i>
                        </div>
                        <h2 class="text-lg font-bold text-gray-800">Message Customer</h2>
                    </div>
                    <div class="p-6">
                        <form id="bookingReplyForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Subject</label>
                                <input type="text" id="replySubject" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none transition-all text-sm text-gray-900" placeholder="Update on your Safari Booking">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Message <span class="text-red-500">*</span></label>
                                <textarea id="replyMessage" rows="5" class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none transition-all text-sm text-gray-900 resize-none" placeholder="Type your message to the customer here..." required></textarea>
                            </div>
                            <div class="flex justify-end pt-2">
                                <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold transition-all shadow-md shadow-primary-600/20 flex items-center gap-2">
                                    <i class="fa-solid fa-paper-plane"></i> Send Message
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Column: Customer Profile -->
            <div class="space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden sticky top-0">
                    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <h2 class="text-lg font-bold text-gray-800">Customer Profile</h2>
                    </div>
                    <div class="p-6">
                        <div class="flex flex-col items-center text-center mb-6">
                            <div class="w-16 h-16 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center text-2xl font-bold mb-3 border-2 border-white shadow-sm">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <h3 id="detailCustomerName" class="font-bold text-gray-900 text-lg"></h3>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-primary-600 bg-primary-50 px-2 py-0.5 rounded mt-1">Primary Guest</span>
                        </div>

                        <div class="space-y-3 pt-4 border-t border-gray-100">
                            <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 transition-colors">
                                <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center shrink-0">
                                    <i class="fa-regular fa-envelope"></i>
                                </div>
                                <div class="overflow-hidden">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Email Address</p>
                                    <a id="detailCustomerEmail" href="#" class="text-gray-900 text-sm font-medium hover:text-primary-600 truncate block"></a>
                                </div>
                            </div>

                            <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 transition-colors">
                                <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Phone Number</p>
                                    <p id="detailCustomerPhone" class="text-gray-900 text-sm font-medium"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
