<div id="page-booking-details" class="page hidden">
    <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <button onclick="navigate('bookings')" class="text-sm text-slate-500 hover:text-primary-600 mb-2 inline-flex items-center gap-1 transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Back to Bookings
            </button>
            <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-3">
                Booking <span id="detailBookingId" class="text-primary-700"></span>
                <span id="detailStatusBadge"></span>
            </h1>
        </div>
        <div class="flex gap-2">
            <button id="btnApproveBooking" class="btn btn-primary bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm shadow-emerald-600/20 px-4 py-2 rounded-lg text-sm font-semibold transition-all">
                <i class="fa-solid fa-check"></i> Approve
            </button>
            <button id="btnRejectBooking" class="btn bg-red-600 hover:bg-red-700 text-white shadow-sm shadow-red-600/20 px-4 py-2 rounded-lg text-sm font-semibold transition-all">
                <i class="fa-solid fa-times"></i> Reject
            </button>
            <button id="btnPendingBooking" class="btn bg-yellow-500 hover:bg-yellow-600 text-white shadow-sm shadow-yellow-500/20 px-4 py-2 rounded-lg text-sm font-semibold transition-all">
                <i class="fa-solid fa-clock"></i> Set Pending
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Details Column -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2"><i class="fa-regular fa-calendar text-primary-600 mr-2"></i> Trip Information</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-4 gap-x-6 text-sm">
                    <div>
                        <p class="text-slate-500 font-medium mb-1">Package</p>
                        <p id="detailPackageName" class="font-semibold text-slate-800"></p>
                    </div>
                    <div>
                        <p class="text-slate-500 font-medium mb-1">Start Date</p>
                        <p id="detailStartDate" class="font-semibold text-slate-800"></p>
                    </div>
                    <div>
                        <p class="text-slate-500 font-medium mb-1">Guests</p>
                        <p class="font-semibold text-slate-800"><span id="detailAdults"></span> Adults, <span id="detailChildren"></span> Children</p>
                    </div>
                    <div>
                        <p class="text-slate-500 font-medium mb-1">Total Price</p>
                        <p id="detailPrice" class="font-bold text-emerald-600 text-lg"></p>
                    </div>
                    <div class="sm:col-span-2">
                        <p class="text-slate-500 font-medium mb-1">Special Requests</p>
                        <p id="detailSpecialRequests" class="text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-100"></p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2"><i class="fa-regular fa-envelope text-primary-600 mr-2"></i> Reply to Customer</h2>
                <form id="bookingReplyForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Subject</label>
                        <input type="text" id="replySubject" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none transition-all" placeholder="Update on your Safari Booking">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Message <span class="text-red-500">*</span></label>
                        <textarea id="replyMessage" rows="5" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none transition-all resize-none" placeholder="Type your reply here..." required></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white px-6 py-2 rounded-lg font-semibold transition-colors shadow-sm shadow-primary-600/20 flex items-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> Send Reply
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Sidebar Column -->
        <div class="space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2"><i class="fa-regular fa-user text-primary-600 mr-2"></i> Customer Details</h2>
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center text-xl font-bold">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <div>
                        <p id="detailCustomerName" class="font-bold text-slate-800 text-lg"></p>
                    </div>
                </div>
                <div class="space-y-3 text-sm">
                    <div class="flex items-start gap-3">
                        <i class="fa-regular fa-envelope text-slate-400 mt-1"></i>
                        <div class="break-all">
                            <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-0.5">Email</p>
                            <a id="detailCustomerEmail" href="#" class="text-primary-600 hover:text-primary-800 font-medium transition-colors"></a>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <i class="fa-solid fa-phone text-slate-400 mt-1"></i>
                        <div>
                            <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-0.5">Phone</p>
                            <p id="detailCustomerPhone" class="text-slate-700 font-medium"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
