<div id="page-edit-tour" class="page">
    <div class="space-y-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight" id="editTourTitle">Edit Tour</h1>
                <p class="text-xs text-gray-500 mt-1">Configure itinerary days, pricing, regional settings, and SEO headers.</p>
            </div>
            <button onclick="navigate('packages')" class="inline-flex items-center gap-2 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200 transition-colors shadow-sm">
                <i class="ph ph-arrow-left"></i> Back to Tours
            </button>
        </div>

        <!-- Form Wrapper -->
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">
            <!-- Main Content Form (Left - 2/3) -->
            <div class="lg:col-span-8 space-y-6">
                <!-- Basic details & Overview -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-circle-info text-amber-500"></i> Tour Overview
                    </h2>
                    
                    <form id="editTourForm" class="space-y-4">
                        <input type="hidden" name="id" id="editTourId">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Tour Title</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="title" required placeholder="e.g. 7-Day Luxury Serengeti Safari">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Slug</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="slug" required placeholder="e.g. 7-day-luxury-serengeti-safari">
                            </div>
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Short Summary Overview</label>
                            <textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="overview" required rows="2" placeholder="Brief summary shown on listings pages..."></textarea>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Detailed Description</label>
                            <textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="description" rows="5" placeholder="Detailed description of the tour route, scenery, and wildlife..."></textarea>
                        </div>
                    </form>
                </div>

                <!-- Itinerary Tab -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-route text-amber-500"></i> Daily Itinerary
                        </h2>
                        <button class="bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition-all" onclick="addItineraryDay()">
                            <i class="ph ph-plus mr-1"></i> Add Day
                        </button>
                    </div>
                    <div id="itineraryContainer" class="space-y-4"></div>
                </div>

                <!-- Locations Tab -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-map-location-dot text-amber-500"></i> National Parks & Reserves
                        </h2>
                        <button class="bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition-all" onclick="addPkgLocation()">
                            <i class="ph ph-plus mr-1"></i> Add Park
                        </button>
                    </div>
                    <div id="locationsContainer" class="space-y-3"></div>
                </div>

                <!-- Highlights, Included / Excluded lists -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-list-check text-amber-500"></i> Highlights & Details
                    </h2>
                    <form id="editTourDetailsForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Highlights (one per line)</label>
                                <textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="highlights_text" rows="3"></textarea>
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Travel Tips (one per line)</label>
                                <textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="travel_tips_text" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Inclusions (one per line)</label>
                                <textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="included_text" rows="3"></textarea>
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Exclusions (one per line)</label>
                                <textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="excluded_text" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- SEO Options -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-magnifying-glass text-amber-500"></i> SEO & Meta Configuration
                    </h2>
                    <form id="editTourSEOForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">SEO Meta Title</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="seo_title">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Canonical URL</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="canonical_url" type="url">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">SEO Keywords (Comma Separated)</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="seo_keywords">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Meta Robots</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="meta_robots" placeholder="index, follow">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">SEO Meta Description</label>
                            <textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="seo_description" rows="2"></textarea>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Sidebar (Right - 1/3) -->
            <div class="lg:col-span-4 space-y-6">
                <!-- Status & Publish Actions -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <h3 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane text-amber-500"></i> Publishing & Status
                    </h3>
                    
                    <div class="space-y-3">
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Status</label>
                            <select id="editTourStatus" class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900">
                                <option value="draft">Draft</option>
                                <option value="published">Published</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-2 pt-2">
                            <label class="inline-flex items-center text-sm font-semibold text-slate-600 cursor-pointer">
                                <input type="checkbox" id="editTourActive" class="rounded border-slate-300 text-amber-500 focus:ring-amber-500 mr-2"> Active / Visible
                            </label>
                            <label class="inline-flex items-center text-sm font-semibold text-slate-600 cursor-pointer">
                                <input type="checkbox" id="editTourFeatured" class="rounded border-slate-300 text-amber-500 focus:ring-amber-500 mr-2"> Featured Listing
                            </label>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-4 flex gap-2">
                        <button onclick="saveEditTour(this)" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-semibold px-5 py-2.5 rounded-lg transition-all text-sm flex items-center justify-center gap-2 shadow-sm shadow-amber-600/10">
                            <i class="ph ph-floppy-disk text-lg"></i> Save Changes
                        </button>
                        <button onclick="navigate('packages')" class="border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold px-4 py-2.5 rounded-lg transition-all text-sm">
                            Cancel
                        </button>
                    </div>
                </div>

                <!-- Pricing & Duration -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <h3 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-dollar-sign text-amber-500"></i> Details & Pricing
                    </h3>
                    
                    <form id="editTourPricingForm" class="space-y-3">
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Price (USD)</label>
                            <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" type="number" name="price_usd" required placeholder="e.g. 2400">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Duration (Days)</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900" type="number" name="duration_days" required placeholder="Days">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Duration (Nights)</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900" type="number" name="duration_nights" placeholder="Nights">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Difficulty</label>
                            <select class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900" name="difficulty">
                                <option>Easy</option>
                                <option>Moderate</option>
                                <option>Challenging</option>
                                <option>Extreme</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Group Min</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900" type="number" name="group_size_min" value="1">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Group Max</label>
                                <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900" type="number" name="group_size_max" value="12">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Minimum Age Limit</label>
                            <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900" type="number" name="age_minimum" value="6">
                        </div>
                    </form>
                </div>

                <!-- Categorization & Regional mapping -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <h3 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-tags text-amber-500"></i> Classification
                    </h3>
                    
                    <form id="editTourClassificationForm" class="space-y-3">
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Category</label>
                            <select id="editTourCategorySelect" class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900" name="category_id"></select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Primary Destination</label>
                            <select id="editTourDestinationSelect" class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900" name="destination_id"></select>
                        </div>
                    </form>
                </div>

                <!-- Images & Media URLs -->
                <div class="bg-white rounded-2xl border border-gray-150 p-6 shadow-sm shadow-slate-100/50 space-y-4">
                    <h3 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-images text-amber-500"></i> Media Slugs
                    </h3>
                    
                    <form id="editTourMediaForm" class="space-y-3">
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Featured Image URL</label>
                            <input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="featured_image_url" placeholder="https://...">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Gallery Image URLs (CSV)</label>
                            <textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm outline-none transition focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-gray-900 placeholder:text-gray-400" name="gallery_urls_csv" rows="3" placeholder="url1, url2..."></textarea>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
