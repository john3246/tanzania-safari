<div id="page-users" class="page">
    <div class="space-y-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Team Accounts</h1>
                <p class="text-sm text-gray-500 mt-1">Manage admin permissions, staff credentials, and active team workspace logs.</p>
            </div>
            <button onclick="openUserModal()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 shadow-sm transition-all duration-200">

                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userBody" class="divide-y divide-gray-100 bg-white">

                    </table>
                </div>
            </div>
        </div>
    </div>
