<div class="space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <h1 class="text-2xl font-bold text-gray-900">Recent Bookings</h1>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-visible flex flex-col min-h-[500px]">
        <div class="p-4 border-b border-gray-200 bg-gray-50/50 flex justify-between items-center">
            <div class="relative w-full max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                <input 
                    type="text" 
                    id="bookingSearch"
                    placeholder="Search bookings by ID or Customer..." 
                    class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-primary-500"
                    onkeyup="filterBookings()"
                />
            </div>
        </div>
        
        <div class="overflow-x-auto relative min-h-[400px]">
            <div class="table-responsive">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-slate-50 border-b border-slate-100 text-slate-400 font-semibold text-xs uppercase tracking-wider">
                        <tr>
                            <th class="px-6 py-4">Booking ID</th>
                            <th class="px-6 py-4">Customer</th>
                            <th class="px-6 py-4">Tour</th>
                            <th class="px-6 py-4">Date</th>
                            <th class="px-6 py-4">Guests</th>
                            <th class="px-6 py-4">Amount</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 bg-white" id="bookBody">
                        <!-- JS will populate rows here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Booking Details Modal -->
<div id="bookingModal" class="modal">
    <div class="modal-content max-w-2xl">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-xl font-bold text-slate-900">Booking Details <span id="detailBookingId" class="text-primary-600"></span></h2>
            <button class="text-slate-400 hover:text-slate-600 transition-colors" onclick="closeBookingModal()">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        
        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-6">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Customer Information</h3>
                    <div class="space-y-1">
                        <div class="text-sm font-medium text-slate-900" id="detailCustomerName"></div>
                        <div class="text-sm text-slate-600 flex items-center gap-2"><i class="fa-solid fa-envelope w-4"></i> <span id="detailCustomerEmail"></span></div>
                        <div class="text-sm text-slate-600 flex items-center gap-2"><i class="fa-solid fa-phone w-4"></i> <span id="detailCustomerPhone"></span></div>
                    </div>
                </div>
                
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Tour Details</h3>
                    <div class="space-y-1">
                        <div class="text-sm font-medium text-slate-900" id="detailPackageName"></div>
                        <div class="text-sm text-slate-600 flex items-center gap-2"><i class="fa-regular fa-calendar w-4"></i> <span id="detailStartDate"></span></div>
                        <div class="text-sm font-bold text-primary-600 mt-2" id="detailPrice"></div>
                    </div>
                </div>
            </div>
            
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Party Size</h3>
                <div class="flex gap-6">
                    <div class="text-sm"><span class="text-slate-500 mr-2">Adults:</span><span class="font-bold text-slate-900" id="detailAdults"></span></div>
                    <div class="text-sm"><span class="text-slate-500 mr-2">Children:</span><span class="font-bold text-slate-900" id="detailChildren"></span></div>
                </div>
            </div>
            
            <div>
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Special Requests</h3>
                <div class="p-4 bg-white border border-slate-200 rounded-xl text-sm text-slate-700 min-h-[80px]" id="detailSpecialRequests">
                </div>
            </div>
        </div>
        
        <div class="flex justify-between items-center mt-8 border-t pt-4">
            <div class="flex gap-2">
                <button type="button" id="btnApproveBooking" class="px-5 py-2.5 text-sm font-medium text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 transition-colors"><i class="fa-solid fa-check mr-2"></i> Approve</button>
                <button type="button" id="btnRejectBooking" class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors"><i class="fa-solid fa-times mr-2"></i> Reject</button>
                <button type="button" id="btnPendingBooking" class="px-5 py-2.5 text-sm font-medium text-slate-700 bg-slate-200 rounded-lg hover:bg-slate-300 transition-colors"><i class="fa-solid fa-clock mr-2"></i> Set Pending</button>
            </div>
            <button type="button" class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors" onclick="closeBookingModal()">Close</button>
        </div>
    </div>
</div>
