<div id="page-bookings" class="page bg-gray-50 flex flex-col h-full min-h-screen">
    <!-- Header Section -->
    <div class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0 shadow-sm z-10">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Booking Pipeline</h1>
            <p class="text-sm text-gray-500 mt-1">Manage, filter, and track all customer bookings.</p>
        </div>
        <div class="flex gap-3">
            <button class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2 shadow-sm" onclick="exportBookingsCSV()">
                <i class="fa-solid fa-download"></i> Export CSV
            </button>
            <button class="bg-primary-600 text-white hover:bg-primary-700 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2 shadow-sm" onclick="showNewBookingModal()">
                <i class="fa-solid fa-plus"></i> New Booking
            </button>
        </div>
    </div>

    <!-- Filters and Tabs -->
    <div class="bg-white border-b border-gray-200 px-6 py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shrink-0">
        <div class="flex space-x-1 bg-gray-100/80 p-1 rounded-lg border border-gray-200/50">
            <button class="tab-btn active px-4 py-1.5 text-sm font-medium rounded-md bg-white text-gray-900 shadow-sm ring-1 ring-gray-200" data-view="list">List View</button>
            <button class="tab-btn px-4 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-50" data-view="pipeline">Pipeline Board</button>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto">
            <div class="relative w-full sm:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input 
                    type="text" 
                    id="bookingSearch"
                    placeholder="Search ID, Customer, or Email..." 
                    class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-primary-500 focus:bg-white transition-colors"
                    onkeyup="filterBookings()"
                />
            </div>
            <button class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 p-2 rounded-lg text-sm transition-colors shadow-sm" title="Advanced Filters">
                <i class="fa-solid fa-filter"></i>
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-auto p-6" id="bookingsContentArea">
        <!-- List View -->
        <div id="bookingListView" class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col h-full">
            <div class="overflow-x-auto relative flex-1">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50/80 border-b border-gray-100 text-gray-500 font-semibold text-xs uppercase tracking-wider sticky top-0 z-10 backdrop-blur-sm">
                        <tr>
                            <th class="px-6 py-4 cursor-pointer hover:bg-gray-100 transition-colors group">ID <i class="fa-solid fa-sort ml-1 text-gray-300 group-hover:text-gray-400"></i></th>
                            <th class="px-6 py-4 cursor-pointer hover:bg-gray-100 transition-colors group">Customer <i class="fa-solid fa-sort ml-1 text-gray-300 group-hover:text-gray-400"></i></th>
                            <th class="px-6 py-4">Tour / Package</th>
                            <th class="px-6 py-4 cursor-pointer hover:bg-gray-100 transition-colors group">Date <i class="fa-solid fa-sort ml-1 text-gray-300 group-hover:text-gray-400"></i></th>
                            <th class="px-6 py-4">Value</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 bg-white" id="bookBody">
                        <!-- JS will populate rows here -->
                    </tbody>
                </table>
            </div>
            <div class="border-t border-gray-200 p-4 bg-gray-50/50 flex justify-between items-center text-sm text-gray-500">
                <span id="bookingCountDisplay">Showing 0 bookings</span>
                <div class="flex gap-2">
                    <button class="px-3 py-1 border border-gray-200 rounded hover:bg-white disabled:opacity-50" disabled>Previous</button>
                    <button class="px-3 py-1 border border-gray-200 rounded hover:bg-white disabled:opacity-50" disabled>Next</button>
                </div>
            </div>
        </div>

        <!-- Pipeline View (Hidden by default) -->
        <div id="bookingPipelineView" class="hidden h-full flex gap-6 overflow-x-auto pb-4">
            <!-- Columns injected by JS -->
        </div>
    </div>
</div>
