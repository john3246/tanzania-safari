<div id="page-chat" class="page">
    <div class="space-y-6">
        <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Live Chat Support</h1>
                <p class="text-sm text-gray-500 mt-1">Reply to website visitors in real time.</p>
            </div>
            <button type="button" id="adminCloseChatBtn" onclick="window.closeCurrentChat && window.closeCurrentChat()" class="inline-flex items-center gap-2 px-3 py-2 text-xs font-semibold rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50" title="Close selected conversation">
                <i class="fa-solid fa-xmark"></i> Close chat
            </button>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 flex flex-col md:flex-row h-[min(70vh,620px)] md:h-[620px] overflow-hidden shadow-sm">
            <div class="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-gray-200 flex flex-col bg-slate-50 max-h-[40%] md:max-h-none">
                <div class="p-4 border-b border-gray-200 bg-white flex items-center justify-between shrink-0">
                    <h3 class="font-bold text-slate-800 text-sm">Active Conversations</h3>
                    <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded-full font-bold" id="chatCountBadge">0</span>
                </div>
                <div id="adminChatList" class="flex-1 overflow-y-auto divide-y divide-gray-150 min-h-0">
                    <div class="p-8 text-center text-gray-400 text-xs">No active chats.</div>
                </div>
            </div>
            <div class="w-full md:w-2/3 flex flex-col bg-white min-h-0 flex-1">
                <div class="p-4 border-b border-gray-200 flex items-center gap-3 bg-slate-50 shrink-0">
                    <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse" id="chatActiveDot" style="display:none"></div>
                    <h3 id="adminCurrentChatTitle" class="font-bold text-slate-800 text-sm truncate">Select a conversation</h3>
                </div>
                <div id="adminChatMessages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50/20 flex flex-col min-h-0">
                    <div class="m-auto text-center text-gray-400 text-sm">
                        <i class="fa-solid fa-comments text-4xl text-gray-300 mb-3 block"></i>
                        Select a chat from the list to start replying.
                    </div>
                </div>
                <div class="p-3 sm:p-4 border-t border-gray-200 bg-white shrink-0">
                    <form id="adminChatForm" class="flex gap-2" onsubmit="if(event){event.preventDefault();} if(window.sendAdminMessage){window.sendAdminMessage();} return false;">
                        <input type="text" id="adminChatInput" class="flex-1 rounded-lg border-gray-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-gray-900" placeholder="Type your reply..." maxlength="2000" disabled autocomplete="off">
                        <button type="submit" id="adminChatSendBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg font-semibold transition-all shadow-sm flex items-center justify-center min-w-[48px]" disabled>
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function handleChatSubmit(e) {
    e.preventDefault();
    if (typeof window.sendAdminMessage === 'function') {
        window.sendAdminMessage();
    }
}

window.initChatPage = function() {
    if (typeof window.initAdminChat === 'function') {
        window.initAdminChat();
    }
};

if (typeof window.initAdminChat === 'function') {
    window.initAdminChat();
}
</script>
