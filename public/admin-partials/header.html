<header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 flex items-center justify-between">

                <button class="lg:hidden text-slate-500 dark:text-slate-400" id="menuToggle"><i class="ph ph-list text-xl"></i></button>
                <div class="flex flex-col">
                    <h1 class="text-lg font-semibold text-slate-800 dark:text-slate-100" id="pageTitle">Dashboard</h1>
                    <div id="breadcrumbContainer" class="text-xs text-slate-500 dark:text-slate-400"></div>
                </div>
            </div>
            <div class="flex items-center space-x-4">
